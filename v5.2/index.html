      if (fullBytes > maxBytes || previewBytes > 45 * 1024) throw new Error(`La variante ${variantIndex + 1} supera el límite de tamaño. Vuelve a prepararla.`);

      variantIds.push(assetId);

        kind, name: String(name || (kind === 'avatar' ? 'Avatar' : 'Wallpaper')).trim().slice(0, 80),
        familyId: String(familyId || assetId), toolId: item.toolId || toolId || '', toolName: item.toolName || toolName || '', accentId: item.accentId || '', accentName: item.accentName || '',
        accentIndex: Number.isFinite(Number(item.accentIndex)) ? Number(item.accentIndex) : 0, accentColor: item.accentColor || '', orientation: item.orientation || '',

        createdById: String(currentUser?.id || ''), createdAt: timestamp, storageBackend: 'firestore'

      return (<div className="bg-surface border-t border-main shrink-0 z-30"><div className="flex items-stretch"><button onClick={() => setActiveTab(aId)} className={`flex-1 flex items-center gap-2 px-3 py-2 border-r border-main ${activeTab === aId ? 'bg-accent/15' : ''}`}><Emoji symbol={tA?.emoji || '📄'} size={14}/><span className={`truncate text-[11px] font-bold ${activeTab === aId ? 'text-accent' : 'text-main'}`}>{tA?.name}</span></button><button onClick={() => setActiveTab(bId)} className={`flex-1 flex items-center gap-2 px-3 py-2 ${activeTab === bId ? 'bg-accent/15' : ''}`}><Emoji symbol={tB?.emoji || '📄'} size={14}/><span className={`truncate text-[11px] font-bold ${activeTab === bId ? 'text-accent' : 'text-main'}`}>{tB?.name}</span></button></div><div className="flex items-center gap-1.5 px-2 py-1.5 border-t border-main overflow-x-auto hide-scrollbar"><button onClick={() => { setViewMode('fullscreen'); setSplitPair(null); }} className="px-2.5 py-1 rounded-md text-[10px] font-bold bg-surface-alt border border-main">⛶ Completa</button><button onClick={() => { setViewMode('floating'); setSplitPair(null); }} className="px-2.5 py-1 rounded-md text-[10px] font-bold bg-surface-alt border border-main">⇱ Flotante</button><button onClick={handleCloseGroup} className="px-2.5 py-1 rounded-md text-[10px] font-bold bg-red-500/15 border border-red-500/40 text-red-400 ml-auto">✕ Cerrar grupo</button></div></div>);
    }
    return (<div className="bg-surface border-t border-main p-2 flex items-center gap-2 overflow-x-auto hide-scrollbar shrink-0 z-30"><button onClick={() => { setActiveTab(null); setViewMode('fullscreen'); }} className={`px-2.5 py-1.5 rounded-lg text-xs font-bold border flex items-center gap-1 shrink-0 ${activeTab === null ? 'bg-accent text-white border-accent' : 'bg-surface-alt text-main border-main'}`}><Emoji symbol="🏠" size={13}/> Inicio</button><div className="h-4 w-px bg-main/20 my-auto"></div>{openAppIds.map(appId => { const tool = ALL_TOOL_LOOKUP.get(String(appId)) || tools.find(t => String(t.id) === String(appId)); if (!tool) return null; const isSel = activeTab === appId; return (<div key={appId} onClick={() => setActiveTab(appId)} className={`flex items-center gap-1.5 p-1 pl-2 pr-1.5 rounded-lg border text-xs font-semibold cursor-pointer shrink-0 ${isSel ? 'bg-accent/15 border-accent text-accent' : 'bg-surface-alt border-main text-muted'}`}><Emoji symbol={tool.emoji || '📄'} size={12}/><span className="truncate max-w-[80px] sm:max-w-[120px] text-[10px]">{tool.name}</span><button onClick={(e) => handleCloseApp(appId, e)} className="w-4 h-4 rounded-full bg-black/10 hover:bg-red-500 hover:text-white flex items-center justify-center text-[9px] font-extrabold">✕</button></div>); })}<div className="h-4 w-px bg-main/20 my-auto"></div>{viewMode === 'fullscreen' && activeTab && (<><button onClick={() => setViewMode('floating')} className="px-2 py-1 rounded-md text-[10px] font-bold bg-surface-alt border border-main text-muted shrink-0">⇱ Flotante</button>{openAppIds.length >= 2 && <button onClick={() => { const o = openAppIds.filter(id => id !== activeTab); enterSplitMode(activeTab, o[0]); }} className="px-2 py-1 rounded-md text-[10px] font-bold bg-surface-alt border border-main text-muted shrink-0">⊟ Dividir</button>}</>)}{viewMode === 'floating' && activeTab && (<><button onClick={() => setViewMode('fullscreen')} className="px-2 py-1 rounded-md text-[10px] font-bold bg-surface-alt border border-main text-muted shrink-0">⛶ Completa</button>{openAppIds.length >= 2 && <button onClick={() => { const o = openAppIds.filter(id => id !== activeTab); enterSplitMode(activeTab, o[0]); }} className="px-2 py-1 rounded-md text-[10px] font-bold bg-surface-alt border border-main text-muted shrink-0">⊟ Dividir</button>}</>)}</div>);
  };

  return (
    <div className={`h-full flex flex-col bg-base relative ${operatorScannerMode ? 'scanner-shell' : ''}`}>
      {showExitToast && (<div className="fixed top-20 left-1/2 -translate-x-1/2 z-[9999] bg-gray-900 text-white rounded-lg shadow-lg px-6 py-3 font-semibold text-center toast-anim whitespace-nowrap text-sm">Presiona atrás 2 veces rápido para salir</div>)}
      {showWelcome && currentUser && (<WelcomeScreen user={currentUserWithMedia || currentUser} onComplete={() => setShowWelcome(false)} />)}
      {showAccentPicker && (<AccentPickerModal activeIndex={paletteIndex} onSelect={setPaletteIndex} onClose={() => setShowAccentPicker(false)} />)}
      {showUserSwitcher && (<UserSelection skipPin={IS_SANDBOX} users={usersWithMedia} currentUser={currentUserWithMedia || currentUser} onLogin={handleLogin} onLogout={handleLogout} onClose={() => setShowUserSwitcher(false)} />)}
      {showFloatingLogin && !currentUser && (
        <FloatingUsersLogin users={usersWithMedia} onLogin={(u) => handleLogin(u)} skipPin={IS_SANDBOX} />
      )}
      {onboardingStep && currentUser && !onboardingDismissedRef.current && (
        <OnboardingFlow
          user={currentUserWithMedia || currentUser}
          gallery={profileMediaGallery}
          galleryLoading={profileMediaLoading}
          mobile={vw < 900}
          prefs={profileMediaPrefs[String(currentUser.id || '')] || {}}
          onAvatarSaved={async (asset) => {
            try { await saveProfileMediaPreference('avatar', asset); } catch(e) { console.warn('[onboarding-avatar]', e); }
          }}
          onWallpaperSaved={async (asset) => {
            try {
              if (vw < 900) {
                if (!cloudDb || !currentUser?.id) return;
                await cloudDb.collection('profile_media_preferences').doc(String(currentUser.id)).set({
                  userId: String(currentUser.id),
                  userName: currentUser.name || '',
                  wallpaperMobileAssetId: asset.id || '',
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
              } else {
                await saveProfileMediaPreference('wallpaper', asset);
              }
            } catch(e) { console.warn('[onboarding-wallpaper]', e); }
          }}
          onFinish={() => { onboardingDismissedRef.current = true; setOnboardingStep(null); }}
        />
      )}
      {showInstallOverlay && !pwaInstalled && (
        <InstallPWAOverlay
          installEvent={installPromptEvent}
          onFinish={() => {
            try { localStorage.setItem('ingesa_install_prompt_dismissed', 'true'); } catch(e) {}
            try { sessionStorage.removeItem('ingesa_install_pending'); } catch(e) {}
            setShowInstallOverlay(false);
          }}
        />
      )}

      {hubOpen && currentUser && (<PersonalizeHub initialTab={hubTab} user={currentUserWithMedia || currentUser} tools={tools} isAdmin={isVallejo} isDark={isDark} setIsDark={setIsDark} paletteIndex={paletteIndex} setPaletteIndex={setPaletteIndex} gallery={profileMediaGallery} galleryLoading={profileMediaLoading} prefs={profileMediaPrefs[String(currentUser.id || '')] || {}} onChoose={saveProfileMediaPreference} onClear={kind => saveProfileMediaPreference(kind, null)} onUpload={uploadProfileMediaAsset} onDelete={deleteProfileMediaAsset} onTabChange={setHubTab} onClose={() => setHubOpen(false)} />)}
      <HamburgerDrawer
        isOpen={isMenuOpen}
        onClose={() => setIsMenuOpen(false)}
        visibleTabs={VISIBLE_TABS}
        activeTab={activeTab}
        openAppIds={openAppIds}
        tools={tools}
        toolIcons={toolIcons}
        onOpenApp={handleOpenApp}
        currentUser={currentUserWithMedia || currentUser}
        savedGroups={savedGroups}
        onOpenGroup={openSavedGroup}
        onDeleteGroup={deleteSavedGroup}
        quickActions={[
          // Apariencia · siempre disponibles
          { emoji: isDark ? '☀️' : '🌙', label: isDark ? 'Modo claro' : 'Modo oscuro', onClick: () => setIsDark(v => !v) },
          { emoji: '🌈', label: 'Color acento', onClick: () => setShowAccentPicker(true) },
          // A partir de aquí solo si hay sesión iniciada
          ...(currentUser ? [
            // Soporte integrado: usuarios reportan, VALLEJO recibe en su buzón
            ...(isVallejo ? [{ emoji: '📫', label: 'Buzón de fallas', onClick: () => setShowBugCenter(true) }] : [{ emoji: '🐞', label: 'Reportar una falla', onClick: () => setShowBugCenter(true) }]),
            // Personalizar (avatar, fondos y apariencia)
            { emoji: '🎨', label: 'Personalizar', onClick: () => setShowProfileMedia(true) },
            // Revalidar herramientas
            {
              emoji: '↻',
              label: toolsLoading ? 'Revalidando…' : 'Revalidar apps',
              onClick: () => { if (!toolsLoading) refreshAuthorizedTools(); }
            },
            // Cuota · solo VALLEJO
            ...(isVallejo ? [{ emoji: '📊', label: 'Cuota Firestore', onClick: () => setShowQuotaModal(true) }] : []),
            // Enviar actualización global · solo VALLEJO
            ...(isVallejo ? [{ emoji: '📡', label: 'Enviar actualización', onClick: () => setShowBroadcastModal(true) }] : []),
            ...(isVallejo ? [{ emoji: '🧬', label: `Herramienta dual${Object.keys(dualToolPairs || {}).length ? ` (${Object.keys(dualToolPairs || {}).length})` : ''}`, onClick: () => setShowDualPairModal(true) }] : []),
            ...(isVallejo ? [{ emoji: '🩺', label: 'Diagnóstico', onClick: () => setShowDiagnostics(true) }] : []),
            ...(canUseSandbox(currentUser) && !IS_SANDBOX ? [{ emoji: '🧪', label: 'Sandbox usuarios', onClick: () => setShowSandbox(true) }] : []),
            ...(isVallejo && !IS_SANDBOX ? [{ emoji: '🔐', label: 'Permisos sandbox', onClick: () => setShowSandboxPerms(true) }] : []),
            // Instalar app · solo si NO está instalada
            ...(!pwaInstalled ? [{
              emoji: '📲',
              label: 'Instalar la app',
              accent: true,
              onClick: () => setShowInstallOverlay(true)
            }] : [])
          ] : [])
        ]}
      />

      <div className="portal-chrome bg-surface border-b border-main shrink-0 z-20 relative header-3d">
        <div className="p-3 flex items-center justify-between gap-2">
          <div className="flex items-center gap-2">
            <button onClick={handleAvatarClick} title="Cambiar usuario" className={`relative shrink-0 cursor-pointer rounded-full ${!currentUser ? 'glow-fuchsia' : ''}`}>
              <div className={`w-10 h-10 rounded-full border overflow-hidden bg-surface-alt flex items-center justify-center ${!currentUser ? 'border-accent' : 'border-main'}`}>
                {currentUser ? ((currentUserWithMedia?.avatar || currentUser.avatar) ? <img src={currentUserWithMedia?.avatar || currentUser.avatar} className="w-full h-full object-cover block"/> : <div className="w-full h-full bg-accent flex items-center justify-center font-bold text-white text-lg">{currentUser.name.charAt(0)}</div> ) : ( <Emoji symbol="👤" size={18} /> )}
              </div>

              {isHernan && !isVallejo && (<span style={{ position: 'absolute', bottom: -2, right: -2, fontSize: 10 }}>🔧</span>)}
            </button>
            <ClockWeatherMini user={currentUser} isVallejo={isVallejo} isNathaly={isNathalyUser(currentUser)} isDev={isDevUser(currentUser)} />
            {currentUser && <button onClick={() => setShowProfileMedia(true)} title="Personalizar avatar y fondo" className="hidden sm:flex w-9 h-9 rounded-xl bg-surface-alt border border-main items-center justify-center text-lg shrink-0">🎨</button>}
            <div className="hidden sm:block text-xs">
              <div className="font-bold text-main truncate max-w-[120px]">{currentUser ? currentUser.name : 'Invitado'}</div>
              <div className="text-[10px] text-muted">{currentUser ? (currentUser.department || currentUser.role || 'Operador') : 'Visita'}</div>
            </div>
          </div>
          <div className="flex items-center justify-center gap-1.5 min-w-0">
            <div className="cursor-pointer shrink-0" onClick={() => { setActiveTab(null); setViewMode('fullscreen'); setSplitPair(null); }}>
              <LogoDisplay snoozeUntil={snoozeUntil} />
            </div>
            <MusicBar user={currentUser} />
            {snoozeUntil && Number(snoozeUntil.until) > Date.now() && (
              <button
                onClick={(e) => { e.stopPropagation(); applyUpdateNow(); }}
                className="px-2.5 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white text-[10px] font-black shadow shrink-0"
                title="Aplicar la actualización ahora"
              >⚡ Actualizar</button>
            )}
          </div>
          <div className="flex items-center gap-2">
            {/* Íconos secundarios · SOLO en pantallas anchas (sm+). En móvil viven dentro del menú hamburguesa. */}
            <div className="hidden sm:flex items-center gap-2">
              {currentUser && canUseSandbox(currentUser) && !IS_SANDBOX && <button onClick={() => setShowSandbox(s => !s)} className="w-10 h-10 rounded-xl bg-surface-alt border border-main flex items-center justify-center text-lg shrink-0" title="Sandbox de usuarios (sin PIN)">🧪</button>}
              {currentUser && isVallejo && !IS_SANDBOX && <button onClick={() => setShowSandboxPerms(true)} className="w-10 h-10 rounded-xl bg-surface-alt border border-main flex items-center justify-center text-lg shrink-0" title="Conceder permisos de sandbox">🔐</button>}
              {currentUser && isVallejoUser(currentUser) && <button onClick={() => setShowQuotaModal(true)} className="w-10 h-10 rounded-xl bg-surface-alt border border-main flex items-center justify-center text-lg shrink-0" title="Medidor estimado de cuota Firestore">📊</button>}
              {currentUser && <button onClick={refreshAuthorizedTools} disabled={toolsLoading} className="w-10 h-10 rounded-xl bg-surface-alt border border-main flex items-center justify-center text-lg shrink-0 disabled:opacity-50" title="Revalidar solo mis herramientas autorizadas en Firestore">{toolsLoading ? '…' : '↻'}</button>}
              <InstallPWAButton installEvent={installPromptEvent} onInstall={handleInstallPWA} installed={pwaInstalled} />
              {!currentUser && <AccentControls isDark={isDark} onToggleDark={() => setIsDark(!isDark)} onOpenAccent={() => setShowAccentPicker(true)} />}
            </div>
            {/* Hamburguesa IZQUIERDA · Custom Tools (solo VALLEJO y HERNÁN/DEV) */}
            {currentUser && (isVallejo || isDevUser(currentUser) || isNathalyUser(currentUser)) && !IS_SANDBOX && (
              <button onClick={() => setShowLeftMenu(true)} className="relative w-11 h-11 rounded-xl bg-surface-alt hover:bg-border-main border border-main flex items-center justify-center text-2xl cursor-pointer shrink-0" title="Menú desarrollador (custom tools · BD alterna)">
                🧰
              </button>
            )}
            {/* Hamburguesa siempre visible (móvil y escritorio) */}
            <TopTools user={currentUser} onMenuClick={() => setIsMenuOpen(true)} />
          </div>
        </div>
        {/* Las pestañas del grupo ahora se renderizan únicamente dentro de ToolWindowContent para no duplicarse en el header */}
      </div>

      <div className="scanner-content flex-1 overflow-hidden relative bg-base" onPointerMove={handleWindowDragMove} onPointerUp={handleWindowDragEnd} onPointerCancel={handleWindowDragEnd}>
        <div className={`absolute inset-0 transition-opacity duration-300 ${activeTab === null ? 'opacity-100 z-10' : 'opacity-0 pointer-events-none'}`}>
          <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url(${homeWallpaperUrl})` }}><div className="absolute inset-0 bg-gradient-to-b from-black/25 via-black/5 to-black/35"></div></div>
          <HomeClock user={currentUser} />

          {VISIBLE_TABS.length === 0 && (<div className="absolute inset-0 flex flex-col items-center justify-center text-center p-6"><div className="w-24 h-24 bg-surface/90 border border-main shadow-lg flex items-center justify-center mb-6 rounded-2xl"><Emoji symbol="📭" size={40}/></div><h2 className="text-2xl font-bold text-white mb-2 uppercase drop-shadow">Sin herramientas</h2><p className="text-white/90 max-w-md font-medium drop-shadow">Inicie sesión para visualizar sus herramientas.</p></div>)}
        </div>
        {viewMode === 'split' && splitPair && splitPair.length === 2 && (<div className="split-container"><div className="split-half" onPointerDown={() => setActiveTab(splitPair[0])}><ToolWindowContent tool={ALL_TOOL_LOOKUP.get(splitPair[0]) || {}} tools={tools} activeSubTabs={activeSubTabs} setActiveSubTabs={setActiveSubTabs} currentUser={currentUser} isDark={isDark} paletteIndex={paletteIndex} registerIframe={registerIframe} isActive={true}/></div><div className="split-half" onPointerDown={() => setActiveTab(splitPair[1])}><ToolWindowContent tool={ALL_TOOL_LOOKUP.get(splitPair[1]) || {}} tools={tools} activeSubTabs={activeSubTabs} setActiveSubTabs={setActiveSubTabs} currentUser={currentUser} isDark={isDark} paletteIndex={paletteIndex} registerIframe={registerIframe} isActive={true}/></div></div>)}
        {viewMode !== 'split' && renderApps()}
      </div>

      {renderBottomBar()}

      {showSandbox && currentUser && canUseSandbox(currentUser) && !IS_SANDBOX && <SandboxWindow onClose={() => setShowSandbox(false)} />}
      {showSandboxPerms && currentUser && isVallejo && !IS_SANDBOX && <SandboxPermissionsModal currentUser={currentUser} users={usersWithMedia} onClose={() => setShowSandboxPerms(false)} />}
      <LeftHamburgerDrawer
        isOpen={showLeftMenu && !!currentUser && (isVallejo || isDevUser(currentUser) || isNathalyUser(currentUser)) && !IS_SANDBOX}
        onClose={() => setShowLeftMenu(false)}
        isVallejo={isVallejo}
        isDev={isDevUser(currentUser)}
        tools={devTools}
        toolIcons={toolIcons}
        loading={devToolsLoading}
        users={usersWithMedia}
        onOpenTool={(t) => { if (!openAppIds.includes(t.id)) setOpenAppIds(prev => [...prev, t.id]); setActiveTab(t.id); setViewMode('fullscreen'); setSplitPair(null); }}
        onNewTool={() => setDevToolEditor({ mode: 'new', data: null })}
        onEditTool={(t) => setDevToolEditor({ mode: 'edit', data: t })}
        onDeleteTool={async (t) => {
          if (!window.confirm(`¿Eliminar "${t.name || t.id}" de la BD alterna?`)) return;
          try { await devCustomToolsRef().doc(String(t.id)).delete(); } catch (e) { alert('No se pudo eliminar: ' + (e?.message || e)); }
        }}
        onReload={() => setDevToolsNonce(n => n + 1)}
        impersonatedUser={impersonatedUser}
        onImpersonate={handleImpersonate}
        onStopImpersonate={handleStopImpersonate}
      />
      {devToolEditor && (
        <DevToolEditorModal
          initial={devToolEditor.data}
          onClose={() => setDevToolEditor(null)}
          onSave={async (payload) => {
            const docId = devToolEditor?.data?.id || `devtool_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
            await devCustomToolsRef().doc(docId).set({
              ...payload,
              id: docId,
              kind: 'dev_custom_tool',
              active: true,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              createdBy: String(currentUser?.name || ''),
              createdById: String(currentUser?.id || '')
            }, { merge: true });
            setDevToolEditor(null);
          }}
        />
      )}
      {showBugCenter && currentUser && <BugReportCenter user={currentUser} activeTool={ALL_TOOL_LOOKUP.get(activeTab) || tools.find(t => String(t.id) === String(activeTab)) || null} inbox={isVallejo} onClose={() => setShowBugCenter(false)} />}
      {showQuotaModal && currentUser && isVallejoUser(currentUser) && <QuotaMonitorModal currentUser={currentUser} onClose={() => setShowQuotaModal(false)} />}
      {showBroadcastModal && currentUser && isVallejoUser(currentUser) && <AppUpdateBroadcastModal currentUser={currentUser} onClose={() => setShowBroadcastModal(false)} />}
      {showDualPairModal && currentUser && isVallejoUser(currentUser) && <DualToolPairModal currentUser={currentUser} tools={tools} toolIcons={toolIcons} pairs={dualToolPairs} onClose={() => setShowDualPairModal(false)} />}
      {groupModalTool && <GroupFolderModal group={groupModalTool} tools={tools} toolIcons={toolIcons} openAppIds={openAppIds} onOpenChild={(id) => handleOpenApp(id)} onClose={() => setGroupModalTool(null)} />}
      {showDiagnostics && <DiagnosticsModal currentUser={currentUser} tools={tools} dualToolPairs={dualToolPairs} visibleTabs={VISIBLE_TABS} onClose={() => setShowDiagnostics(false)} />}
      {impersonatedUser && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[10060] px-4 py-2 rounded-xl bg-amber-500 text-white text-[11px] font-black shadow-lg flex items-center gap-2">
          🔁 Suplantando a {impersonatedUser.name}
          <button onClick={handleStopImpersonate} className="ml-2 px-2 py-1 rounded-lg bg-black/25 text-[10px]">Detener</button>
        </div>
      )}
      {pendingUpdate?.showModal && (
        <div className="fixed inset-0 z-[10090] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="card-box w-full max-w-md p-5 fade-slide-up">
            <div className="text-center mb-4">
              <div style={{ fontSize: 54, lineHeight: 1 }}>🔄</div>
              <h2 className="text-xl font-black text-main mt-2">Actualización disponible</h2>
              <p className="text-xs text-muted mt-2">{pendingUpdate.note}</p>
            </div>
            <div className="space-y-2">
              <button onClick={applyUpdateNow} className="btn-base btn-primary w-full text-sm">⚡ Aplicar ahora</button>
              <button onClick={() => snoozeUpdate(30)} className="btn-base btn-ghost w-full text-sm">⏱ Omitir 30 minutos</button>
              <button onClick={() => snoozeUpdate(60)} className="btn-base btn-ghost w-full text-sm">⏱ Omitir 1 hora</button>
            </div>
            <p className="text-[10px] text-muted text-center mt-3 leading-relaxed">Mientras omites, el logo del header muestra la cuenta regresiva. Al llegar a 0 la app se recargará sola para aplicar la actualización.</p>
          </div>
        </div>
      )}
      {broadcastNotice && (
        <div className="fixed inset-0 z-[10200] flex flex-col items-center justify-center gap-4 px-6 text-center" style={{ background: 'radial-gradient(circle at 50% 38%, #1b1b26 0%, #0a0a0f 72%)', color: '#fff' }}>
          <div style={{ fontSize: 64, lineHeight: 1 }}>🔄</div>
          <div className="text-2xl font-black">Recibiendo actualización</div>
          <div className="text-sm" style={{ opacity: 0.7, maxWidth: 340 }}>{broadcastNotice}</div>
          <div className="text-xs" style={{ opacity: 0.45, marginTop: 6 }}>Limpiando caché local y recargando…</div>
        </div>
      )}

    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
 </body>
</html>
