};

/* ---------- Música local + Radio ---------- */
const RADIO_EC = (typeof window !== 'undefined' && window.INGESA_RADIO_EC) || [];
const MusicBar = ({ user }) => {
  const audioRef = useRef(null);
  const [mode, setMode] = useState('local'); // local | radio
  const [files, setFiles] = useState([]); // File[]
  const [idx, setIdx] = useState(0);
  const [winStart, setWinStart] = useState(0);
  const [urls, setUrls] = useState({}); // index -> objectURL (máx 10 en memoria)
  const urlsRef = useRef({});
  const [playing, setPlaying] = useState(false);
  const [shuffle, setShuffle] = useState(false);
  const [open, setOpen] = useState(false);
  const [station, setStation] = useState(null);
  const [stations, setStations] = useState(RADIO_EC);
  const [showCover, setShowCover] = useState(false);
  const [newStName, setNewStName] = useState(''); const [newStUrl, setNewStUrl] = useState(''); const [newStLogo, setNewStLogo] = useState('');
  const [progress, setProgress] = useState(0); const [dur, setDur] = useState(0);
  const loadWindow = (start, list) => {
    const next={}; for(let i=start;i<Math.min(start+10, list.length);i++){ next[i]=URL.createObjectURL(list[i]); }
    Object.values(urlsRef.current).forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} });
    urlsRef.current = next; setUrls(next); setWinStart(start);
  };
  const pickFiles = (e) => {
    const list = Array.from(e.target.files || []).filter(f=>/audio|video/i.test(f.type) || /\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name));
    if(!list.length) return;
    const capped = list.slice(0,1000);
    setFiles(capped); setIdx(0); loadWindow(0, capped); setMode('local'); setStation(null);
    setTimeout(()=>{ const a=audioRef.current; if(a){ a.src=URL.createObjectURL(capped[0]); a.play().catch(()=>{}); setPlaying(true); } }, 50);
  };
  const playIndex = (i) => {
    if(!files.length) return;
    let s = winStart;
    if(i < winStart || i >= winStart+10){ s = Math.floor(i/10)*10; loadWindow(s, files); }
    setIdx(i);
    setTimeout(()=>{ const a=audioRef.current; if(!a) return; const u = urlsRef.current[i]; if(u){ a.src=u; a.play().catch(()=>{}); setPlaying(true); } }, 60);
  };
  const nextTrack = () => { if(!files.length) return; playIndex((idx+1)%files.length); };
  const prevTrack = () => { if(!files.length) return; playIndex((idx-1+files.length)%files.length); };
  const togglePlay = () => { const a=audioRef.current; if(!a) return; if(a.paused){ a.play().catch(()=>{}); setPlaying(true); } else { a.pause(); setPlaying(false); } };
  const doShuffle = () => {
    if(files.length<2) return; const cur=files[idx]; const rest=files.filter((_,i)=>i!==idx);
    for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=rest[i]; rest[i]=rest[j]; rest[j]=t; }
    const list=[cur, ...rest]; setFiles(list); setIdx(0); loadWindow(0, list);
    setTimeout(()=>{ const a=audioRef.current; if(a && urlsRef.current[0]){ a.src=urlsRef.current[0]; a.play().catch(()=>{}); setPlaying(true); } }, 60);
  };
  const playStation = async (st) => {
    const a=audioRef.current; if(!a) return;
    let url=st.url;
    if(/\.m3u8?$|\.pls$/i.test(url)){ try{ const r=await fetch(url); const t=await r.text(); const m=t.split(/\n/).find(l=>/^https?:\/\//.test(l.trim())); if(m) url=m.trim(); }catch(e){} }
    setStation(st); setMode('radio'); a.src=url; a.play().catch(()=>{}); setPlaying(true); setShowCover(true);
    setTimeout(()=>setShowCover(false), 6000);
    if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({ title: st.name, artist: st.city+' · Radio en vivo', album:'INGESA Radio', artwork: st.logo?[{src:st.logo,sizes:'512x512',type:'image/png'}]:[] }); }catch(e){} }
  };
  useEffect(()=>{ const a=audioRef.current; if(!a) return; const onEnd=()=>{ if(mode==='local') nextTrack(); }; const onTime=()=>{ setProgress(a.currentTime||0); setDur(a.duration||0); }; a.addEventListener('ended',onEnd); a.addEventListener('timeupdate',onTime); return ()=>{ a.removeEventListener('ended',onEnd); a.removeEventListener('timeupdate',onTime); }; });
  useEffect(()=>{ if('mediaSession' in navigator){ try{ navigator.mediaSession.setActionHandler('play', ()=>{ audioRef.current && audioRef.current.play(); }); navigator.mediaSession.setActionHandler('pause', ()=>{ audioRef.current && audioRef.current.pause(); }); navigator.mediaSession.setActionHandler('previoustrack', prevTrack); navigator.mediaSession.setActionHandler('nexttrack', nextTrack); }catch(e){} } });
  useEffect(()=>{ if(mode==='local' && files[idx] && 'mediaSession' in navigator){ try{ navigator.mediaSession.metadata=new MediaMetadata({ title: files[idx].name.replace(/\.[^.]+$/,''), artist:'Música local · INGESA', album:'Archivos del dispositivo' }); }catch(e){} } }, [idx, files]);
  const curName = mode==='radio' ? (station?station.name:'Radio') : (files[idx]?files[idx].name.replace(/\.[^.]+$/,''):'Sin música');
  const addStation = () => { if(!newStName.trim() || !newStUrl.trim()) return; const st={ name:newStName.trim(), url:newStUrl.trim(), logo:newStLogo.trim(), city:'Agregada', genre:'', verified:false }; const next=[...stations, st]; setStations(next); try{ localStorage.setItem('ingesa_radio_custom', JSON.stringify(next.filter(s=>!s.verified))); }catch(e){} setNewStName(''); setNewStUrl(''); setNewStLogo(''); };
  useEffect(()=>{ try{ const c=JSON.parse(localStorage.getItem('ingesa_radio_custom')||'[]'); if(c.length) setStations(prev=>[...prev, ...c]); }catch(e){} }, []);
  return (
    <div className="tb-music">
      <audio ref={audioRef} preload="auto" />
      <button className="tb-mbtn" onClick={prevTrack} title="Anterior">⏮</button>
      <button className="tb-mbtn tb-play" onClick={togglePlay} title={playing?'Pausar':'Reproducir'}>{playing?'⏸':'▶️'}</button>
      <button className="tb-mbtn" onClick={nextTrack} title="Siguiente">⏭</button>
      <button className="tb-mname" onClick={()=>setOpen(true)} title="Toca para abrir el reproductor">🎵 {curName}{files.length?` · ${idx+1}/${files.length}`:''}{mode==='radio'?' 📻':''}</button>
      <button className="tb-mbtn" onClick={doShuffle} title="Aleatorio: mezcla la lista y libera la memoria, menos la que suena">🔀</button>
      {showCover && station && station.logo && (<div className="tb-cover"><img src={station.logo} alt={station.name} /><span>{station.name}</span></div>)}
      {open && (
        <div className="tb-modal-backdrop" onClick={()=>setOpen(false)}>
          <div className="tb-modal" onClick={(e)=>e.stopPropagation()}>
            <div className="tb-modal-head"><b>🎵 Música y Radio</b><button className="tb-x" onClick={()=>setOpen(false)}>✕</button></div>
            <div className="tb-tabs"><button className={mode==='local'?'on':''} onClick={()=>setMode('local')}>📁 Mis archivos</button><button className={mode==='radio'?'on':''} onClick={()=>setMode('radio')}>📻 Radio Ecuador</button></div>
            {mode==='local' ? (<div className="tb-pad">
              <p><b>{curName}</b></p>
              <p className="tb-muted">{files.length?`Canción ${idx+1} de ${files.length} · cargadas en memoria: ${Object.keys(urls).length} de 10 (lote ${Math.floor(winStart/10)+1})`:'Aún no elegiste música.'}</p>
              <input type="range" min="0" max={dur||0} value={progress} onChange={(e)=>{ const a=audioRef.current; if(a){ a.currentTime=Number(e.target.value); } }} style={{width:'100%'}} />
              <div className="tb-row"><button className="tb-btn" onClick={prevTrack}>⏮ Anterior</button><button className="tb-btn" onClick={togglePlay}>{playing?'⏸ Pausar':'▶️ Reproducir'}</button><button className="tb-btn" onClick={nextTrack}>Siguiente ⏭</button><button className="tb-btn" onClick={doShuffle}>🔀 Aleatorio</button></div>
              <label className="tb-btn" style={{display:'inline-block',marginTop:8}}>📂 Elegir canciones<input type="file" accept="audio/*" multiple style={{display:'none'}} onChange={pickFiles} /></label>
              <label className="tb-btn" style={{display:'inline-block',marginTop:8,marginLeft:8}}>📁 Elegir carpeta<input type="file" accept="audio/*" multiple webkitdirectory="" style={{display:'none'}} onChange={pickFiles} /></label>
              <p className="tb-muted">Puedes elegir hasta 1000 canciones. El navegador solo carga 10 en memoria a la vez: al pasar al siguiente lote, bota las 10 anteriores y carga las siguientes. En aleatorio, se bota todo menos la que está sonando y se reordena la lista. Con la PWA instalada y el audio sonando, los controles aparecen en la pantalla de bloqueo del celular (Media Session); si el sistema pausa el audio al bloquear, vuelve a darle play desde ahí.</p>
              <div className="tb-list">{files.slice(winStart, winStart+10).map((f,i)=>(<button key={winStart+i} className={winStart+i===idx?'tb-track on':'tb-track'} onClick={()=>playIndex(winStart+i)}>{winStart+i+1}. {f.name}</button>))}</div>
            </div>) : (<div className="tb-pad">
              <p className="tb-muted">Estaciones de Guayaquil y Quito. Al cambiar de estación se muestra su portada 6 segundos y luego se enrolla.</p>
              {stations.length===0 ? <p className="tb-muted">Aún no hay estaciones verificadas cargadas. Agrega una con su URL de stream abajo.</p> : stations.map((st,i)=>(<div key={i} className="tb-item"><img src={st.logo||''} alt="" style={{width:40,height:40,objectFit:'cover',borderRadius:8,display:st.logo?'block':'none'}} /><div><b>{st.name}</b><span> · {st.city}{st.genre?' · '+st.genre:''}</span></div><button className="tb-btn" onClick={()=>playStation(st)}>{station===st && playing?'🔊 Sonando':'▶️ Escuchar'}</button></div>))}
              <h3>➕ Agregar estación (URL .m3u / .pls / mp3)</h3>
              <input className="tb-input" placeholder="Nombre de la estación" value={newStName} onChange={(e)=>setNewStName(e.target.value)} />
              <input className="tb-input" placeholder="URL del stream (https://…mp3, .m3u, .pls)" value={newStUrl} onChange={(e)=>setNewStUrl(e.target.value)} />
              <input className="tb-input" placeholder="URL del logo/portada (opcional)" value={newStLogo} onChange={(e)=>setNewStLogo(e.target.value)} />
              <button className="tb-btn" onClick={addStation}>Agregar estación</button>
            </div>)}
          </div>
        </div>
      )}
    </div>
  );
};

/* ---------- Herramientas derechas: calculadora, notas, más ---------- */
const TopTools = ({ user, onMenuClick }) => {
  const [open, setOpen] = useState(null); // null | 'calc' | 'notes' | 'tools'
  const [expr, setExpr] = useState(''); const [res, setRes] = useState('');
  const [notes, setNotes] = useState(()=>{ try{ return JSON.parse(localStorage.getItem('ingesa_notes_'+(user?user.id:'guest'))||'[]'); }catch(e){ return []; } });
  const [noteText, setNoteText] = useState('');
  const [timer, setTimer] = useState(0);
  useEffect(()=>{ if(timer<=0) return; const t=setInterval(()=>setTimer(v=>Math.max(0,v-1)),1000); return ()=>clearInterval(t); }, [timer>0]);
  const calc = (v) => { if(v==='C'){ setExpr(''); setRes(''); return; } if(v==='='){ try{ const clean=expr.replace(/[^0-9+\-*/().% ]/g,''); if(!clean) return; const val=Function('"use strict"; return ('+clean+')')(); setRes(String(val)); }catch(e){ setRes('Error'); } return; } setExpr(e=>e+v); };
  const saveNote = () => { if(!noteText.trim()) return; const n={ id:Date.now(), text:noteText.trim(), date:new Date().toLocaleString('es-MX') }; const next=[n,...notes]; setNotes(next); try{ localStorage.setItem('ingesa_notes_'+(user?user.id:'guest'), JSON.stringify(next)); }catch(e){} setNoteText(''); };
  const delNote = (id) => { const next=notes.filter(n=>n.id!==id); setNotes(next); try{ localStorage.setItem('ingesa_notes_'+(user?user.id:'guest'), JSON.stringify(next)); }catch(e){} };
  return (
    <div className="tb-tools">
      <button className="tb-tbtn" onClick={()=>setOpen('calc')} title="Calculadora">🧮</button>
      <button className="tb-tbtn" onClick={()=>setOpen('notes')} title="Notas personales">📝{notes.length>0 && <span className="tb-badge">{notes.length}</span>}</button>
      <button className="tb-tbtn" onClick={()=>setOpen('tools')} title="Más herramientas">🛠️</button>
      <button className="tb-tbtn" onClick={onMenuClick} title="Menú">☰</button>
      {open && (<div className="tb-modal-backdrop" onClick={()=>setOpen(null)}><div className="tb-modal tb-modal-sm" onClick={(e)=>e.stopPropagation()}>
        <div className="tb-modal-head"><b>{open==='calc'?'🧮 Calculadora':open==='notes'?'📝 Notas personales':'🛠️ Herramientas'}</b><button className="tb-x" onClick={()=>setOpen(null)}>✕</button></div>
        {open==='calc' && (<div className="tb-pad"><div className="tb-calc-display">{expr||'0'}{res!=='' && <div>= {res}</div>}</div><div className="tb-calc-grid">{['7','8','9','/','4','5','6','*','1','2','3','-','0','.','%','+','C','='].map(k=>(<button key={k} onClick={()=>calc(k)}>{k}</button>))}</div></div>)}
        {open==='notes' && (<div className="tb-pad"><textarea className="tb-input" rows="3" placeholder="Escribe una nota personal…" value={noteText} onChange={(e)=>setNoteText(e.target.value)} /><button className="tb-btn" onClick={saveNote}>Guardar nota</button>{notes.map(n=>(<div key={n.id} className="tb-item"><div>{n.text}</div><span>{n.date}</span><button onClick={()=>delNote(n.id)}>Eliminar</button></div>))}{notes.length===0 && <p className="tb-muted">Tus notas son solo tuyas, se guardan en este dispositivo.</p>}</div>)}
        {open==='tools' && (<div className="tb-pad">
          <button className="tb-btn" onClick={()=>{ setOpen('calc'); }}>🧮 Calculadora</button>{' '}
          <button className="tb-btn" onClick={()=>{ setOpen('notes'); }}>📝 Notas</button>
          <h3>⏱️ Temporizador rápido</h3>
          <div className="tb-row"><button className="tb-btn" onClick={()=>setTimer(5*60)}>5 min</button><button className="tb-btn" onClick={()=>setTimer(15*60)}>15 min</button><button className="tb-btn" onClick={()=>setTimer(30*60)}>30 min</button><span>{timer>0 ? Math.floor(timer/60)+':'+String(timer%60).padStart(2,'0') : '—'}</span></div>
          <h3>📏 Conversor textil rápido</h3>
          <p className="tb-muted">1 metro = 1.0936 yardas · 1 yarda = 0.9144 m · 1 kg = 2.2046 lb</p>
          <p className="tb-muted">Estas herramientas abren en modales pequeños y no sacan de la pantalla actual.</p>
        </div>)}
      </div></div>)}
    </div>
  );
};


const WallpaperPicker = ({ user, isAdmin, gallery, loading, prefs, onUpload, onDelete }) => {
  const [section, setSection] = useState('mobile');
  const [pcWallpapers, setPCWallpapers] = useState([]);
  const [pcLoading, setPCLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [notice, setNotice] = useState('');
  const [name, setName] = useState('');
  const [mobileFiles, setMobileFiles] = useState([]);
  const [pcFiles, setPCFiles] = useState([]);
  const [inputKey, setInputKey] = useState(0);

  useEffect(() => {
    if (!cloudDb) { setPCLoading(false); return undefined; }
    const unsub = cloudDb.collection(PC_WALLPAPER_COLLECTION).orderBy('createdAt', 'desc').limit(120).onSnapshot(
      snap => { setPCWallpapers(snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(w => w.active !== false)); setPCLoading(false); },
      err => { console.warn('[pc_wallpaper]', err); setPCLoading(false); }
    );
    return () => unsub();
  }, []);

  const mobileGroups = useMemo(() => {
    const map = new Map();
    gallery.filter(a => a.kind === 'wallpaper' && a.active !== false && a.orientation !== 'desktop').forEach(a => {
      const key = String(a.familyId || a.id);
      if (!map.has(key)) map.set(key, { id: key, name: a.name || 'Fondo', asset: a });
    });
    return Array.from(map.values());
  }, [gallery]);

  const mobId = String(prefs.wallpaperMobileAssetId || '');
  const deskId = String(prefs.wallpaperAssetId || '');

  const save = async (patch, msg) => {
    if (!cloudDb) return setNotice('No está disponible ingesa-cloud.');
    setBusy(true);
    try { await cloudDb.collection('profile_media_preferences').doc(String(user.id)).set({ userId: String(user.id), userName: user.name || '', updatedAt: firebase.firestore.FieldValue.serverTimestamp(), ...patch }, { merge: true }); setNotice(msg); }
    catch (e) { setNotice('No se pudo guardar: ' + e.message); }
    finally { setBusy(false); }
  };
  const chooseMobile = (g) => save({ wallpaperMobileAssetId: g.asset.id }, 'Fondo de celular aplicado.');
  const choosePC = (w) => save({ wallpaperAssetId: w.id }, 'Fondo de PC aplicado.');
  const restoreMobile = () => save({ wallpaperMobileAssetId: '' }, 'Se restauró el fondo de celular.');
  const restorePC = () => save({ wallpaperAssetId: '' }, 'Se restauró el fondo de PC.');

  const removeMobile = async (g) => {
    if (!window.confirm(`¿Retirar "${g.name}" de la galería móvil?`)) return;
    setBusy(true);
    try { await onDelete(g.asset); setNotice('Fondo retirado.'); } catch (e) { setNotice('No se pudo retirar: ' + e.message); } finally { setBusy(false); }
  };
  const removePC = async (w) => {
    if (!window.confirm(`¿Retirar "${w.name}" de la galería PC?`)) return;
    setBusy(true);
    try { await cloudDb.collection(PC_WALLPAPER_COLLECTION).doc(w.id).delete(); setNotice('Fondo PC retirado.'); } catch (e) { setNotice('No se pudo retirar: ' + e.message); } finally { setBusy(false); }
  };

  const doUploadMobile = async () => {
    if (!mobileFiles.length) return setNotice('Elige al menos una imagen.');
    setBusy(true); const errors = []; let ok = 0;
    for (let i = 0; i < mobileFiles.length; i++) {
      const file = mobileFiles[i];
      try {
        setNotice(`Preparando ${i + 1}/${mobileFiles.length}…`);
        const dataUrl = await compressImageToBase64(file, { maxSide: 1800, maxBytes: 700 * 1024 });
        const previewDataUrl = await compressImageToBase64(file, { maxSide: 280, maxBytes: 40 * 1024 });
        const familyId = `wpm_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        await onUpload({ kind: 'wallpaper', name: (mobileFiles.length === 1 && name.trim()) || file.name.replace(/\.[^.]+$/, ''), familyId, variants: [{ orientation: 'mobile', dataUrl, previewDataUrl }], onProgress: d => setNotice(`${file.name}: ${d}`) });
        ok++;
      } catch (e) { errors.push(`${file.name}: ${e.message}`); }
    }
    setNotice(`${ok} fondo(s) móvil agregado(s).${errors.length ? ' Errores: ' + errors.join(' ') : ''}`);
    setMobileFiles([]); setName(''); setInputKey(k => k + 1); setBusy(false);
  };

  const doUploadPC = async () => {
    if (!pcFiles.length) return setNotice('Elige al menos una imagen.');
    if (!isAdmin) return setNotice('Solo VALLEJO puede subir fondos de PC.');
    setBusy(true); const errors = []; let ok = 0;
    for (let i = 0; i < pcFiles.length; i++) {
      const file = pcFiles[i];
      try {
        setNotice(`Comprimiendo ${i + 1}/${pcFiles.length} para PC…`);
        await uploadPCWallpaper({

/* ================== OVERLAY DE INSTALACIÓN (PWA) ==================
   Aparece en móvil después del onboarding si la app no está instalada.
   Fases: idle → installing (progreso animado ~4 s) → success (instrucciones).
*/
const INSTALL_DURATION_MS = 15000;
const INSTALL_SESSION_KEY = 'ingesa_install_pending';

const InstallPWAOverlay = ({ installEvent, onFinish }) => {
  const [phase, setPhase] = useState(() => {
    // Si venimos de un reload durante la instalación (Chrome a veces recarga al aceptar
    // el prompt nativo), saltamos directo a la pantalla de instrucciones.
    try { return sessionStorage.getItem(INSTALL_SESSION_KEY) === '1' ? 'success' : 'idle'; } catch (e) { return 'idle'; }
  });
  const [progress, setProgress] = useState(() => {
    try { return sessionStorage.getItem(INSTALL_SESSION_KEY) === '1' ? 100 : 0; } catch (e) { return 0; }
  });
  const [statusText, setStatusText] = useState('');
  const intervalRef = useRef(null);
  const successTimerRef = useRef(null);

  const isIOS = useMemo(() => {
    try { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; } catch (e) { return false; }
  }, []);
  const needsManualInstall = !installEvent && isIOS;

  // Limpieza de timers al desmontar
  useEffect(() => {
    return () => {
      if (intervalRef.current) clearInterval(intervalRef.current);
      if (successTimerRef.current) clearTimeout(successTimerRef.current);
    };
  }, []);

  // Si ya estamos en 'success', limpiar la bandera de sesión
  useEffect(() => {
    if (phase === 'success') {
      try { sessionStorage.removeItem(INSTALL_SESSION_KEY); } catch (e) {}
    }
  }, [phase]);

  // Botón ENTRAR: navega a la URL de INGESA. Chrome en Android, al detectar que
  // hay una PWA instalada con esa URL, muestra automáticamente el banner
  // "Abrir en la app INGESA" — eso abre la app real, no el navegador.
  const enterApp = () => {
    try { localStorage.setItem('ingesa_install_prompt_dismissed', 'true'); } catch (e) {}
    try { sessionStorage.removeItem(INSTALL_SESSION_KEY); } catch (e) {}
    const url = 'https://ingesa.oneapp.dev/';
    // Android: intent:// es el mecanismo oficial para forzar la apertura de la app
    // cuando Chrome no ofrece automáticamente el banner. Incluimos fallback a la URL.
    if (/android/i.test(navigator.userAgent)) {
      const intentUrl = `intent://ingesa.oneapp.dev/#Intent;scheme=https;S.browser_fallback_url=${encodeURIComponent(url)};end`;
      try { window.location.href = intentUrl; return; } catch (e) { /* fallback abajo */ }
    }
    // iOS + fallback genérico
    window.location.href = url;
  };

  // Escuchar 'appinstalled': si el navegador confirma la instalación ANTES de los 15 s,
  // saltamos inmediatamente a la pantalla de éxito sin esperar el resto del tiempo.
  useEffect(() => {
    const onInstalled = () => {
      if (intervalRef.current) clearInterval(intervalRef.current);
      if (successTimerRef.current) clearTimeout(successTimerRef.current);
      setProgress(100);
      setStatusText('¡Instalada!');
      successTimerRef.current = setTimeout(() => {
        try { sessionStorage.removeItem(INSTALL_SESSION_KEY); } catch (e) {}
        setPhase('success');
      }, 700);
    };
    window.addEventListener('appinstalled', onInstalled);
    return () => window.removeEventListener('appinstalled', onInstalled);
  }, []);

  const startInstall = () => {
    setPhase('installing');
    setProgress(0);
    setStatusText('Preparando instalación…');
    // Marcar en sessionStorage para sobrevivir un posible reload del navegador
    try { sessionStorage.setItem(INSTALL_SESSION_KEY, '1'); } catch (e) {}

    const startedAt = Date.now();
    if (intervalRef.current) clearInterval(intervalRef.current);
    intervalRef.current = setInterval(() => {
      const elapsed = Date.now() - startedAt;
      const p = Math.min(97, (elapsed / INSTALL_DURATION_MS) * 100);
      setProgress(p);
      if (p < 15) setStatusText('Preparando instalación…');
      else if (p < 40) setStatusText('Descargando recursos…');
      else if (p < 62) setStatusText('Guardando en tu dispositivo…');
      else if (p < 85) setStatusText('Configurando acceso directo…');
      else setStatusText('Finalizando…');
    }, 120);

    // Lanzamos el prompt nativo SIN esperar su resolución — el tiempo visual manda.
    // Android mostrará su diálogo encima; el overlay sigue corriendo por detrás.
    if (installEvent) {
      setTimeout(() => {
        try { installEvent.prompt(); } catch (e) { console.warn('[install overlay]', e); }
      }, 400);
    }

    // Esperar SIEMPRE los 15 s completos, pase lo que pase con el prompt nativo
    if (successTimerRef.current) clearTimeout(successTimerRef.current);
    successTimerRef.current = setTimeout(() => {
      if (intervalRef.current) clearInterval(intervalRef.current);
      setProgress(100);
      setStatusText('¡Listo!');
      setTimeout(() => {
        try { sessionStorage.removeItem(INSTALL_SESSION_KEY); } catch (e) {}
        setPhase('success');
      }, 700);
    }, INSTALL_DURATION_MS);
  };

  return (
    <div
      className="fixed inset-0 z-[10095] flex flex-col items-center justify-center px-6 fade-slide-up"
      style={{ background: 'radial-gradient(circle at 50% 30%, #1b1b26 0%, #06060a 74%)', color: '#fff' }}
    >
      {phase === 'idle' && (
        <>
          <div className="text-center mb-9" style={{ maxWidth: 360 }}>
            <div className="mb-6" style={{ fontSize: 78, lineHeight: 1, filter: 'drop-shadow(0 10px 28px rgba(230,43,112,.55))' }}>📲</div>
            <h2 className="text-3xl font-black mb-3" style={{ letterSpacing: '-.02em' }}>Instala INGESA</h2>
            <p className="text-sm leading-relaxed" style={{ opacity: .78 }}>
              Tenla siempre a la mano: sin abrir el navegador, más rápida y en pantalla completa.
            </p>
          </div>
          <button
            onClick={startInstall}
            className="w-full py-5 rounded-2xl text-lg font-black transition-transform active:scale-[.98]"
            style={{
              maxWidth: 380,
              background: 'linear-gradient(135deg, #e62b70, #8b5cf6)',
              boxShadow: '0 22px 52px -14px rgba(230,43,112,.78)',
              border: 'none',
              color: '#fff',
              cursor: 'pointer',
              letterSpacing: '.05em'
            }}
          >
            📲 INSTALAR AHORA
          </button>
          <p className="mt-6 text-[11px] font-bold text-center" style={{ opacity: .45, maxWidth: 320 }}>
            La instalación toma solo unos segundos y es necesaria para usar INGESA correctamente.
          </p>
        </>
      )}

      {phase === 'installing' && (
        <div className="w-full text-center" style={{ maxWidth: 380 }}>
          <div
            className="mx-auto mb-8 rounded-full flex items-center justify-center"
            style={{
              width: 148,
              height: 148,
              background: `conic-gradient(from -90deg, #e62b70 0%, #8b5cf6 ${progress}%, rgba(255,255,255,.08) ${progress}% 100%)`,
              padding: 7
            }}
          >
            <div className="w-full h-full rounded-full flex items-center justify-center" style={{ background: '#0a0a12' }}>
              <span style={{ fontSize: 54, lineHeight: 1 }}>📲</span>
            </div>
          </div>
          <h2 className="text-2xl font-black mb-2">Instalando…</h2>
          <p className="text-sm mb-6" style={{ opacity: .75 }}>{statusText || 'Preparando…'}</p>
          <div className="w-full h-2.5 rounded-full overflow-hidden" style={{ background: 'rgba(255,255,255,.10)' }}>
            <div
              className="h-full rounded-full transition-all duration-300"
              style={{ width: `${progress}%`, background: 'linear-gradient(90deg, #e62b70, #8b5cf6)' }}
            />
          </div>
          <p className="mt-3 text-base font-black">{Math.round(progress)}%</p>
        </div>
      )}

      {phase === 'success' && (
        <>
          <div
            className="mb-7 rounded-full flex items-center justify-center"
            style={{
              width: 132,
              height: 132,
              background: 'linear-gradient(135deg, #22c55e, #16a34a)',
              boxShadow: '0 22px 52px -14px rgba(34,197,94,.72)'
            }}
          >
            <span style={{ fontSize: 70, lineHeight: 1 }}>✓</span>
          </div>
          <h2 className="text-3xl font-black mb-2 text-center">¡INGESA instalada!</h2>
          <p className="text-sm text-center mb-6" style={{ opacity: .8, maxWidth: 340 }}>
            Ya puedes usarla como una app real en tu celular.
          </p>

          <div
            className="flex items-center gap-3 px-5 py-3 rounded-2xl mb-7"
            style={{ background: 'rgba(255,255,255,.08)', border: '1px solid rgba(255,255,255,.15)' }}
          >
            <img
              src={BRAND_LOGO_URL}
              alt="INGESA"
              style={{
                width: 48, height: 48, objectFit: 'contain', borderRadius: 12,
                background: 'linear-gradient(135deg, #e62b70, #8b5cf6)', padding: 4
              }}
            />
            <span className="text-base font-black">INGESA</span>
          </div>

          <div className="text-sm leading-relaxed mb-7" style={{ opacity: .88, maxWidth: 360, textAlign: 'left' }}>
            {needsManualInstall ? (
              <>
                <p className="mb-2">👉 Abre Safari y toca el botón <b>Compartir</b> ⬆️.</p>
                <p className="mb-2">👉 Elige <b>"Añadir a pantalla de inicio"</b>.</p>
                <p>👉 Confirma tocando <b>"Añadir"</b>. ¡Listo!</p>
              </>
            ) : (
              <>
                <p className="mb-2">👉 Pulsa <b>ENTRAR A INGESA</b> abajo.</p>
                <p className="mb-2">👉 Si tu celular lo pregunta, elige <b>"Abrir en la app INGESA"</b>.</p>
                <p>👉 También puedes buscar el ícono <b>INGESA</b> en tu pantalla de inicio: ya no necesitarás el navegador.</p>
              </>
            )}
          </div>

          <button
            onClick={enterApp}
            className="w-full py-5 rounded-2xl text-lg font-black transition-transform active:scale-[.98] mb-3"
            style={{
              maxWidth: 380,
              background: 'linear-gradient(135deg, #22c55e, #16a34a)',
              boxShadow: '0 22px 52px -14px rgba(34,197,94,.72)',

            }}
          >

          </button>
          <button

const FirestoreQuotaTab = ({ currentUser }) => {
  const [enabled, setEnabled] = useState(false);
  const [configLoading, setConfigLoading] = useState(true);
  const [saving, setSaving] = useState(false);
  const [days, setDays] = useState(7);
  const [rows, setRows] = useState([]);
  const [loadedAt, setLoadedAt] = useState(null);
  const [loadingRows, setLoadingRows] = useState(false);
  const [resetting, setResetting] = useState(false);
  const [notice, setNotice] = useState('');

  useEffect(() => {
    const unsub = db.collection('launcher_settings').doc('firestore_quota_monitor').onSnapshot(doc => {
      setEnabled(!!(doc.exists && doc.data()?.enabled === true));
      setConfigLoading(false);
    }, err => { setNotice(`No se pudo leer el control: ${err.code || err.message}`); setConfigLoading(false); });
    return () => unsub();
  }, []);

  const saveEnabled = async next => {
    if (!isVallejoUser(currentUser) || saving) return;
    setSaving(true); setNotice('');
    try {
      await db.collection('launcher_settings').doc('firestore_quota_monitor').set({
        enabled: !!next,
        updatedAt: FieldValue.serverTimestamp(),
        updatedBy: String(currentUser?.name || 'VALLEJO')
      }, { merge: true });
      setEnabled(!!next);
      setNotice(next ? 'Medición activada. Las pestañas abiertas la recibirán en tiempo real.' : 'Medición desactivada. El historial guardado se conserva.');
    } catch (e) { setNotice(`No se pudo cambiar el control: ${e.code || e.message}`); }
    setSaving(false);
  };

  const loadUsage = async () => {
    if (!isVallejoUser(currentUser) || loadingRows) return;
    setLoadingRows(true); setNotice('');
    try {
      const cutoff = new Date(Date.now() - Number(days) * 86400000).toISOString().slice(0, 10);
      const snap = await db.collection('firestore_quota_usage').where('date', '>=', cutoff).orderBy('date', 'desc').limit(1000).get();
      const grouped = new Map();
      snap.docs.forEach(doc => {
        const d = doc.data() || {};
        const key = String(d.userId || doc.id);
        const row = grouped.get(key) || { userId:key, userName:d.userName || key, role:d.role || '', reads:0, meterWrites:0, byApp:{}, lastDate:'' };
        row.reads += Number(d.estimatedReads || 0);
        row.meterWrites += Number(d.meterWrites || 0);
        Object.entries(d.readsByApp || {}).forEach(([app, count]) => { row.byApp[app] = (row.byApp[app] || 0) + (Number(count) || 0); });
        if (String(d.date || '') > row.lastDate) row.lastDate = String(d.date || '');
        grouped.set(key, row);
      });
      setRows(Array.from(grouped.values()).sort((a,b) => b.reads - a.reads));
      setLoadedAt(new Date());
      setNotice(snap.size >= 1000 ? 'Se alcanzó el límite de 1,000 registros; el resultado puede estar truncado.' : '');
    } catch (e) { setNotice(`No se pudo cargar el historial: ${e.code || e.message}`); }
    setLoadingRows(false);
  };

  const resetUsage = async () => {
    if (!isVallejoUser(currentUser) || resetting) return;
    if (!window.confirm('¿Cortar el conteo y reiniciar desde cero?\n\nSe apagará el medidor para que todas las pestañas vuelquen sus pendientes, se borrará todo el historial acumulado y se reactivará limpio.')) return;
    setResetting(true); setNotice('');
    try {
      // 1) Apagar el medidor: cada pestaña vuelca sus lotes en memoria y deja de contar.
      await db.collection('launcher_settings').doc('firestore_quota_monitor').set({
        enabled: false,
        updatedAt: FieldValue.serverTimestamp(),
        updatedBy: String(currentUser?.name || 'VALLEJO')
      }, { merge: true });
      setEnabled(false);
      // 2) Esperar a que el cambio se propague y terminen los volcados pendientes.
      await new Promise(r => setTimeout(r, 1800));
      // 3) Borrar en lotes todos los documentos del histórico del medidor.
      let deleted = 0;
      for (let pass = 0; pass < 50; pass++) {
        const snap = await db.collection('firestore_quota_usage').limit(450).get();
        if (snap.empty) break;
        const batch = db.batch();
        snap.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
        deleted += snap.size;
        if (snap.size < 450) break;
      }
      setRows([]); setLoadedAt(null);
      // 4) Reactivar el medidor: comienza a contar desde cero.
      await db.collection('launcher_settings').doc('firestore_quota_monitor').set({
        enabled: true,
        updatedAt: FieldValue.serverTimestamp(),
        updatedBy: String(currentUser?.name || 'VALLEJO')
      }, { merge: true });
      setEnabled(true);
      setNotice(`Conteo cortado y reiniciado desde cero. ${deleted} registro(s) eliminado(s). El medidor vuelve a estar activo y empieza a acumular de nuevo.`);
    } catch (e) {
      setNotice(`No se pudo reiniciar el conteo: ${e.code || e.message}`);
    }
    setResetting(false);
  };

  if (!isVallejoUser(currentUser)) return <div className="p-4 text-sm text-red-400">Acceso exclusivo de VALLEJO.</div>;
  const totalReads = rows.reduce((n, r) => n + r.reads, 0);
  const totalMeterWrites = rows.reduce((n, r) => n + r.meterWrites, 0);

  return <div className="space-y-4">
    <div className="rounded-xl border border-amber-500/40 bg-amber-500/10 p-3">
      <div className="text-sm font-black text-main">Medidor estimado de lecturas Firestore</div>
      <p className="mt-1 text-[11px] leading-relaxed text-muted">Esto no es el contador oficial de facturación de Firebase ni atribuye la cuota exacta a cada usuario. Estima lecturas de pantallas instrumentadas del proyecto principal ingesa-database. El proyecto separado ingesa-cloud no se suma aquí. La medición agrega conteos localmente y escribe un lote cada 25 lecturas; esas escrituras también consumen recursos.</p>
    </div>

    <div className="rounded-xl border border-main bg-surface-alt p-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div className="min-w-0"><div className="text-xs font-black text-main">Registro global de consumo estimado</div><div className="text-[10px] text-muted mt-1">{configLoading ? 'Leyendo configuración…' : enabled ? 'Activo en las pantallas INGESA actualizadas.' : 'Apagado; no se acumulan nuevos registros.'}</div></div>
      <button disabled={configLoading || saving} onClick={() => saveEnabled(!enabled)} className={`btn-base shrink-0 text-xs ${enabled ? '' : 'btn-primary'}`} style={enabled ? { background:'#ef4444', color:'#fff', borderColor:'#ef4444' } : undefined}>{saving ? 'Guardando…' : enabled ? 'Desactivar medidor' : 'Activar medidor'}</button>
    </div>

    <div className="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
      <select value={days} onChange={e => setDays(Number(e.target.value))} className="input-base text-xs"><option value={7}>Últimos 7 días</option><option value={30}>Últimos 30 días</option></select>
      <button disabled={loadingRows} onClick={loadUsage} className="btn-base btn-primary text-xs">{loadingRows ? 'Consultando…' : '↻ Consultar consumo'}</button>
      <button disabled={resetting || saving || configLoading} onClick={resetUsage} className="btn-base text-xs text-white" style={{ background: '#ef4444', borderColor: '#ef4444' }} title="Apaga el medidor, borra todo el historial acumulado y lo reactiva en cero">{resetting ? 'Reiniciando…' : '🗑️ Cortar y reiniciar'}</button>
      {loadedAt && <span className="text-[10px] text-muted">Actualizado {loadedAt.toLocaleTimeString('es-MX')}</span>}
    </div>

    {rows.length > 0 && <div className="grid grid-cols-2 gap-2">
      <div className="rounded-lg border border-main bg-surface-alt p-3"><div className="text-[9px] font-black uppercase text-muted">Lecturas estimadas</div><div className="text-xl font-black text-accent">{totalReads.toLocaleString('es-MX')}</div></div>
      <div className="rounded-lg border border-main bg-surface-alt p-3"><div className="text-[9px] font-black uppercase text-muted">Escrituras de agregación</div><div className="text-xl font-black text-main">{totalMeterWrites.toLocaleString('es-MX')}</div></div>
    </div>}

    {rows.length === 0 ? <div className="rounded-lg border border-main bg-surface-alt p-5 text-center text-xs text-muted">{loadedAt ? 'No hay datos en el periodo elegido.' : 'Consulta el historial cuando quieras; la consulta no queda escuchando en tiempo real.'}</div> : <div className="space-y-2">
      {rows.map(row => <div key={row.userId} className="rounded-xl border border-main bg-surface-alt p-3">
        <div className="flex items-start justify-between gap-2"><div className="min-w-0"><div className="truncate text-sm font-black text-main">{row.userName}</div><div className="text-[10px] text-muted">{row.role || 'Sin rol'} · último registro {row.lastDate || '—'}</div></div><div className="shrink-0 text-right"><div className="text-lg font-black text-accent">{row.reads.toLocaleString('es-MX')}</div><div className="text-[9px] uppercase text-muted">lecturas aprox.</div></div></div>
        {Object.keys(row.byApp).length > 0 && <div className="mt-2 flex flex-wrap gap-1">{Object.entries(row.byApp).sort((a,b)=>b[1]-a[1]).map(([app,count])=><span key={app} className="rounded-full border border-main bg-surface px-2 py-1 text-[9px] text-muted">{app}: <b className="text-main">{count.toLocaleString('es-MX')}</b></span>)}</div>}
      </div>)}
    </div>}
    <div className="text-[9px] leading-relaxed text-muted">Para conocer el interruptor, cada pantalla abierta mantiene una suscripción a un documento de configuración (una lectura inicial y lecturas cuando cambia). Apagado detiene los conteos y escrituras de agregación, pero conserva esa lectura mínima del interruptor. Los datos se agrupan por usuario y día; apagar no borra el historial. El consumo oficial se consulta en Firebase/Google Cloud Usage. La restricción a VALLEJO es del cliente; este paquete no cambia reglas de Firestore ni aísla contra consultas directas. Las salidas de consultas se cuentan de forma conservadora y los lotes aún en memoria podrían perderse si el navegador termina antes de guardarlos.</div>
    {notice && <div className={`rounded-lg border px-3 py-2 text-[10px] ${notice.startsWith('No se pudo') ? 'border-red-500/40 bg-red-500/10 text-red-300' : 'border-main bg-surface-alt text-muted'}`}>{notice}</div>}
  </div>;
};

/* ===== Broadcast de actualización · LIMPIEZA TOTAL DE LA APP =====
   Solo VALLEJO. Escribe en launcher_settings/app_updates un resetAt nuevo.
   Todos los dispositivos conectados (incluido VALLEJO) escuchan ese doc,
   limpian TODO el caché local (ingesa_* excepto whitelist) y recargan la app
   para recibir la versión más reciente. No cierra sesión ni borra preferencias. */
const AppUpdateBroadcastModal = ({ currentUser, onClose }) => {
  const [note, setNote] = useState('Actualización disponible');
  const [sending, setSending] = useState(false);
  const [notice, setNotice] = useState('');
  const [lastSend, setLastSend] = useState(null);

  useEffect(() => {
    const unsub = db.collection('launcher_settings').doc('app_updates').onSnapshot(doc => {
      if (!doc.exists) { setLastSend(null); return; }
      const d = doc.data() || {};
      if (d.resetAt && typeof d.resetAt.toDate === 'function') {
        setLastSend({ at: d.resetAt.toDate().toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }), by: d.resetBy || '—', note: d.resetNote || '' });
      } else setLastSend(null);
    }, () => {});
    return () => unsub();
  }, []);

  const send = async () => {
    if (!isVallejoUser(currentUser) || sending) return;
    if (!window.confirm('¿Enviar ACTUALIZACIÓN a TODOS los usuarios?\n\nSe limpiará el caché local y la app se recargará automáticamente en todos los dispositivos conectados, incluido el tuyo (VALLEJO).')) return;
    setSending(true); setNotice('');
    try {
      await db.collection('launcher_settings').doc('app_updates').set({
        resetAt: FieldValue.serverTimestamp(),
        resetBy: String(currentUser?.name || 'VALLEJO'),
        resetNote: String(note || '').trim().slice(0, 200),
        version: Date.now()
      }, { merge: true });
      setNotice('✅ Actualización enviada a todos los dispositivos conectados. En unos segundos limpiarán su caché y se recargarán.');
    } catch (e) {
      setNotice('❌ No se pudo enviar: ' + (e?.code || e?.message || e));
    }
    setSending(false);
  };

  return (
    <div className="fixed inset-0 z-[10070] bg-black/80 backdrop-blur-sm p-3 flex items-center justify-center" onClick={onClose}>
      <div className="w-full max-w-lg rounded-2xl border border-main bg-surface shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between border-b border-main px-4 py-3" style={{ background: 'linear-gradient(180deg, color-mix(in srgb, var(--bg-surface) 90%, #ef4444), var(--bg-surface))' }}>
          <div>
            <div className="text-[10px] font-black uppercase tracking-widest text-accent">VALLEJO · ACTUALIZACIÓN GLOBAL</div>
            <h2 className="text-base font-black text-main">Enviar actualización a todos</h2>
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-lg bg-surface-alt border border-main text-main text-xl" aria-label="Cerrar">×</button>
        </div>
        <div className="p-4 space-y-3">
          <div className="rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-[11px] leading-relaxed text-amber-200">
            <b className="text-amber-100">Se aplica a TODOS los usuarios conectados, incluido VALLEJO.</b> Cada dispositivo limpiará su caché local (imágenes, listados, plantillas, etiquetas, documentos cacheados) y se recargará para recibir la versión más reciente. No cierra sesión ni borra preferencias (tema, color, grupos guardados).
          </div>
          <label className="block">
            <div className="text-[10px] font-black uppercase tracking-widest text-muted mb-1">Mensaje para los usuarios (opcional)</div>
            <input value={note} onChange={e => setNote(e.target.value)} maxLength={120} className="input-base text-sm" placeholder="Actualización disponible" />
          </label>
          {lastSend && (
            <div className="rounded-xl border border-main bg-surface-alt p-3 text-[10px] text-muted">
              <div className="font-black uppercase tracking-widest text-main text-[9px] mb-1">Último envío</div>
              <div>{lastSend.at} · por <b className="text-main">{lastSend.by}</b>{lastSend.note ? <> · “{lastSend.note}”</> : ''}</div>
            </div>
          )}
          <button disabled={sending} onClick={send} className="w-full btn-base text-sm font-black text-white" style={{ background: sending ? 'var(--bg-surface-alt)' : 'linear-gradient(180deg, #ef4444, #b91c1c)', borderColor: '#ef4444', color: sending ? 'var(--text-muted)' : '#fff' }}>
            {sending ? 'Enviando…' : '📡 Enviar actualización a todos los usuarios'}
          </button>
          {notice && <div className={`rounded-lg border px-3 py-2 text-[10px] ${notice.startsWith('❌') ? 'border-red-500/40 bg-red-500/10 text-red-300' : 'border-emerald-500/40 bg-emerald-500/10 text-emerald-200'}`}>{notice}</div>}
        </div>
      </div>
    </div>
  );
};

/* ===== HERRAMIENTA DUAL (VALLEJO) =====
   Permite emparejar dos custom tools (misma app, HTML distinto para móvil y PC).
   Los usuarios ven UNA entrada y el portal carga la variante correcta según
   el ancho de pantalla. VALLEJO solo necesita conceder el ID canónico. */
const DualToolPairModal = ({ currentUser, tools = [], toolIcons = {}, pairs = {}, onClose }) => {
  const isVallejo = isVallejoUser(currentUser);
  const [busy, setBusy] = useState(false);
  const [notice, setNotice] = useState('');
  const [form, setForm] = useState({ id: '', name: '', emoji: '📱', canonicalToolId: '', mobileToolId: '', desktopToolId: '', active: true });
  const [allTools, setAllTools] = useState([]);
  const [loadingAllTools, setLoadingAllTools] = useState(false);
  const pairsList = useMemo(() => Object.values(pairs || {}).filter(p => p && p.id), [pairs]);

  // Carga TODAS las custom_tools de la BD principal para que VALLEJO pueda
  // emparejar herramientas que no tenga asignadas en su propio allowedTools.
  // Si la lectura falla, caemos de vuelta a la prop `tools` (las que ya están cargadas).
  useEffect(() => {
    if (!isVallejo) return undefined;
    let active = true;
    setLoadingAllTools(true);
    db.collection('custom_tools').get().then(snapshot => {
      if (!active) return;
      const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      setAllTools(list);
    }).catch(error => {
      console.warn('[dual_tool_pair candidates]', error?.code || error?.message || error);
      if (active) setAllTools(tools || []);
    }).finally(() => { if (active) setLoadingAllTools(false); });
    return () => { active = false; };
  }, [isVallejo]);

  // Combinar: primero las cargadas desde Firestore, luego cualquier tool
  // del portal que no esté en esa lista (por si el snapshot aún no llegó o
  // la lectura falló).
  const candidates = useMemo(() => {
    const map = new Map();
    (allTools || []).forEach(t => { if (t?.id) map.set(String(t.id), t); });
    (tools || []).forEach(t => { if (t?.id && !map.has(String(t.id))) map.set(String(t.id), t); });
    return Array.from(map.values()).filter(t => t?.id && !t.isGroup && String(t.name || '').trim().toLowerCase() !== 'root');
  }, [allTools, tools]);
  const resetForm = () => setForm({ id: '', name: '', emoji: '📱', canonicalToolId: '', mobileToolId: '', desktopToolId: '', active: true });

  if (!isVallejo) return null;

  const save = async () => {
    if (busy) return;
    if (!form.mobileToolId || !form.desktopToolId) return setNotice('Debes seleccionar la versión móvil y la versión PC.');
    if (form.mobileToolId === form.desktopToolId) return setNotice('Las dos versiones deben ser herramientas distintas.');
    const canonical = form.canonicalToolId || form.mobileToolId;
    if (canonical !== form.mobileToolId && canonical !== form.desktopToolId) return setNotice('La herramienta canónica debe ser una de las dos versiones.');
    setBusy(true); setNotice('');
    try {
      const pairId = form.id || `pair_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      const pair = {
        id: pairId,
        name: String(form.name || '').trim() || (candidates.find(t => String(t.id) === String(form.mobileToolId))?.name || 'Herramienta'),
        emoji: String(form.emoji || '').trim() || '📱',
        canonicalToolId: String(canonical),
        mobileToolId: String(form.mobileToolId),
        desktopToolId: String(form.desktopToolId),
        active: form.active !== false,
        updatedAt: FieldValue.serverTimestamp(),
        updatedBy: String(currentUser?.name || 'VALLEJO')
      };
      const ref = db.collection('launcher_settings').doc('dual_tool_pairs');
      const fresh = await ref.get();
      const currentPairs = fresh.exists ? { ...(fresh.data()?.pairs || {}) } : {};
      currentPairs[pairId] = pair;
      await ref.set({ pairs: currentPairs, updatedAt: FieldValue.serverTimestamp(), updatedBy: String(currentUser?.name || 'VALLEJO') }, { merge: true });
      setNotice('✅ Par guardado. Asigna a los usuarios únicamente el ID canónico para activarlo.');
      resetForm();
    } catch (e) {
      setNotice('❌ ' + (e?.code || e?.message || e));
    }
    setBusy(false);
  };

  const remove = async (pairId) => {
    if (busy) return;
    if (!window.confirm('¿Eliminar este par? Las dos herramientas volverán a mostrarse por separado.')) return;
    setBusy(true); setNotice('');
    try {
      const ref = db.collection('launcher_settings').doc('dual_tool_pairs');
      const fresh = await ref.get();
      const currentPairs = fresh.exists ? { ...(fresh.data()?.pairs || {}) } : {};
      delete currentPairs[pairId];
      await ref.set({ pairs: currentPairs, updatedAt: FieldValue.serverTimestamp() }, { merge: true });
      setNotice('✅ Par eliminado.');
    } catch (e) {
      setNotice('❌ ' + (e?.code || e?.message || e));
    }
    setBusy(false);
  };

  const edit = (pair) => setForm({ ...pair, active: pair.active !== false });

  return (
    <div className="fixed inset-0 z-[10080] bg-black/80 backdrop-blur-sm p-3 flex items-center justify-center" onClick={onClose}>
      <div className="w-full max-w-2xl max-h-[92vh] rounded-2xl border border-main bg-surface shadow-2xl overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between border-b border-main px-4 py-3">
          <div>
            <div className="text-[10px] font-black uppercase tracking-widest text-accent">VALLEJO · HERRAMIENTA DUAL</div>
            <h2 className="text-base font-black text-main">Unificar versión móvil y PC</h2>
          </div>
          <button onClick={onClose} className="w-9 h-9 rounded-lg bg-surface-alt border border-main text-main text-xl">×</button>
        </div>
        <div className="p-4 space-y-3 overflow-y-auto">
          <div className="rounded-xl border border-amber-500/40 bg-amber-500/10 p-3 text-[11px] leading-relaxed text-amber-200">
            Empareja dos custom tools que sean <b>la misma app en HTML distinto</b>: una para móvil y otra para PC. Los usuarios verán <b>una sola entrada</b> con el ícono y nombre elegidos, y el portal cargará automáticamente la variante correcta según el ancho de pantalla. A los usuarios solo se les concede el <b>ID canónico</b>.
          </div>

          <div className="flex items-center justify-between gap-2 text-[10px] text-muted">
            <span>Mostrando <b className="text-main">{candidates.length}</b> herramienta(s) de la BD principal</span>
            {loadingAllTools && <span className="px-2 py-0.5 rounded-full bg-surface-alt border border-main">Cargando catálogo…</span>}
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label className="block">
              <div className="text-[10px] font-black uppercase text-muted mb-1">Versión móvil</div>
              <select value={form.mobileToolId} onChange={e => setForm(f => ({ ...f, mobileToolId: e.target.value, canonicalToolId: f.canonicalToolId || e.target.value }))} disabled={loadingAllTools && candidates.length === 0} className="input-base text-xs">
                <option value="">{loadingAllTools && candidates.length === 0 ? 'Cargando…' : '— Selecciona —'}</option>
                {candidates.map(t => <option key={t.id} value={String(t.id)}>{t.name || t.id}</option>)}
              </select>
            </label>
            <label className="block">
              <div className="text-[10px] font-black uppercase text-muted mb-1">Versión PC</div>
              <select value={form.desktopToolId} onChange={e => setForm(f => ({ ...f, desktopToolId: e.target.value }))} disabled={loadingAllTools && candidates.length === 0} className="input-base text-xs">
                <option value="">{loadingAllTools && candidates.length === 0 ? 'Cargando…' : '— Selecciona —'}</option>
                {candidates.map(t => <option key={t.id} value={String(t.id)}>{t.name || t.id}</option>)}
              </select>
            </label>
            <label className="block">
              <div className="text-[10px] font-black uppercase text-muted mb-1">ID canónico (asignar al usuario)</div>
              <select value={form.canonicalToolId} onChange={e => setForm(f => ({ ...f, canonicalToolId: e.target.value }))} className="input-base text-xs">
                <option value="">— Mismo que móvil —</option>
                {form.mobileToolId && <option value={form.mobileToolId}>{candidates.find(t => String(t.id) === String(form.mobileToolId))?.name || form.mobileToolId} (móvil)</option>}
                {form.desktopToolId && <option value={form.desktopToolId}>{candidates.find(t => String(t.id) === String(form.desktopToolId))?.name || form.desktopToolId} (PC)</option>}
              </select>
            </label>
            <label className="block">
              <div className="text-[10px] font-black uppercase text-muted mb-1">Emoji</div>
              <input value={form.emoji} onChange={e => setForm(f => ({ ...f, emoji: e.target.value }))} className="input-base text-xs text-center" maxLength={4} />
            </label>
            <label className="block sm:col-span-2">
              <div className="text-[10px] font-black uppercase text-muted mb-1">Nombre visible (opcional)</div>
              <input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} className="input-base text-xs" placeholder="Si lo dejas vacío, se usa el nombre de la versión móvil" />
            </label>
            <label className="flex items-center gap-2 text-xs sm:col-span-2">
              <input type="checkbox" checked={form.active !== false} onChange={e => setForm(f => ({ ...f, active: e.target.checked }))} /> Activo
            </label>
          </div>

          <button onClick={save} disabled={busy} className="btn-base btn-primary w-full text-sm">{busy ? 'Guardando…' : form.id ? '💾 Guardar cambios' : '＋ Crear par'}</button>
          {form.id && <button onClick={resetForm} disabled={busy} className="btn-base btn-ghost w-full text-xs">Cancelar edición</button>}
          {notice && <div className={`rounded-lg border px-3 py-2 text-[10px] ${notice.startsWith('❌') ? 'border-red-500/40 bg-red-500/10 text-red-300' : 'border-emerald-500/40 bg-emerald-500/10 text-emerald-200'}`}>{notice}</div>}

          <div className="pt-2 border-t border-main">
            <div className="text-[10px] font-black uppercase text-muted mb-2">Pares existentes</div>
            {pairsList.length === 0 ? (
              <div className="text-xs text-muted py-2">Aún no hay pares configurados.</div>
            ) : (
              <div className="space-y-2">
                {pairsList.map(p => {
                  const mobile = candidates.find(t => String(t.id) === String(p.mobileToolId));
                  const desktop = candidates.find(t => String(t.id) === String(p.desktopToolId));
                  const canonical = candidates.find(t => String(t.id) === String(p.canonicalToolId));
                  const mobileMissing = !mobile;
                  const desktopMissing = !desktop;
                  const canonicalMissing = !canonical;
                  const broken = mobileMissing || desktopMissing || canonicalMissing;
                  return (
                    <div key={p.id} className={`rounded-xl border p-2 ${broken ? 'border-red-500/50 bg-red-500/5' : p.active === false ? 'border-main bg-surface-alt opacity-60' : 'border-accent/50 bg-accent/5'}`}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0 flex-1">
                          <div className="text-xs font-bold text-main truncate">{p.emoji || '📱'} {p.name || 'Sin nombre'}{broken && <span className="text-red-400 ml-1">⚠️</span>}</div>
                          <div className="text-[10px] text-muted truncate">📱 {mobile?.name || p.mobileToolId} · 🖥️ {desktop?.name || p.desktopToolId}</div>
                          <div className="text-[9px] text-muted truncate">Canónico: {p.canonicalToolId}</div>
                          {broken && (
                            <div className="text-[9px] text-red-400 mt-1 space-y-0.5">
                              {mobileMissing && <div>• Falta versión móvil: <span className="font-mono">{p.mobileToolId}</span></div>}
                              {desktopMissing && <div>• Falta versión PC: <span className="font-mono">{p.desktopToolId}</span></div>}
                              {canonicalMissing && <div>• Falta canónico: <span className="font-mono">{p.canonicalToolId}</span></div>}
                            </div>
                          )}
                        </div>
                        <div className="flex gap-1 shrink-0">
                          <button onClick={() => edit(p)} className="btn-base btn-ghost text-[10px] px-2">✎</button>
                          <button onClick={() => remove(p.id)} className="btn-base text-[10px] px-2" style={{ background: '#ef4444', color: '#fff', borderColor: '#ef4444' }}>🗑</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

const SandboxWindow = ({ onClose }) => {
  const SIZES = { phone: { w: 390, h: 740 }, tablet: { w: 820, h: 680 }, pc: { w: 1100, h: 700 } };
  const [size, setSize] = useState('phone');
  const [pos, setPos] = useState(() => ({ x: Math.max(8, window.innerWidth - 410), y: 56 }));
  const [mini, setMini] = useState(false);
  const [maxed, setMaxed] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const drag = useRef(null);
  const src = useMemo(() => { const u = new URL(window.location.href); u.search = ''; u.hash = ''; u.searchParams.set('sandbox', '1'); return u.toString(); }, []);
  const vwN = window.innerWidth, vhN = window.innerHeight;
  const w = maxed ? vwN : Math.min(SIZES[size].w, vwN - 12);
  const h = maxed ? vhN : Math.min(SIZES[size].h, vhN - 70);
  const x = maxed ? 0 : Math.min(Math.max(0, pos.x), Math.max(0, vwN - w));
  const y = maxed ? 0 : Math.min(Math.max(0, pos.y), Math.max(0, vhN - 44));
  const down = e => { if (maxed) return; drag.current = { id: e.pointerId, sx: e.clientX, sy: e.clientY, x, y }; e.currentTarget.setPointerCapture?.(e.pointerId); };
  const move = e => { const d = drag.current; if (!d || d.id !== e.pointerId) return; setPos({ x: d.x + e.clientX - d.sx, y: d.y + e.clientY - d.sy }); };
  const up = () => { drag.current = null; };
  const Btn = ({ children, onClick, active, title }) => (<button onPointerDown={e => e.stopPropagation()} onClick={onClick} title={title} className={`w-7 h-7 rounded-lg border text-[11px] font-black shrink-0 ${active ? 'bg-accent text-white border-accent' : 'bg-surface border-main text-muted'}`}>{children}</button>);
  return (
    <div style={{ position: 'fixed', left: x, top: y, width: w, height: mini ? 40 : h, zIndex: 10050, borderRadius: maxed ? 0 : 16, border: '2px solid #f59e0b', boxShadow: '0 18px 50px -12px rgba(0,0,0,.6)', overflow: 'hidden', display: 'flex', flexDirection: 'column', background: 'var(--bg-surface)' }}>
      <div onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} className="flex items-center gap-1.5 px-2 shrink-0" style={{ height: 40, background: 'var(--bg-surface-alt)', borderBottom: '1px solid var(--border-main)', touchAction: 'none', cursor: maxed ? 'default' : 'grab', userSelect: 'none' }}>
        <span className="text-[11px] font-black text-main truncate flex-1">🧪 SANDBOX · sin PIN</span>
        <Btn title="Celular" active={size === 'phone'} onClick={() => { setSize('phone'); setMaxed(false); }}>📱</Btn>
        <Btn title="Tablet" active={size === 'tablet'} onClick={() => { setSize('tablet'); setMaxed(false); }}>▭</Btn>
        <Btn title="PC" active={size === 'pc'} onClick={() => { setSize('pc'); setMaxed(false); }}>🖥</Btn>
        <Btn title="Reiniciar sandbox" onClick={() => setReloadKey(k => k + 1)}>↻</Btn>
        <Btn title="Minimizar" onClick={() => setMini(m => !m)}>{mini ? '▢' : '_'}</Btn>
        <Btn title="Pantalla completa" active={maxed} onClick={() => setMaxed(m => !m)}>⛶</Btn>
        <Btn title="Cerrar" onClick={onClose}>✕</Btn>
      </div>
      <iframe key={reloadKey} src={src} title="Sandbox INGESA" style={{ flex: 1, minHeight: 0, width: '100%', border: 0, display: mini ? 'none' : 'block', background: 'var(--bg-base)' }} />
    </div>
  );
};

/* ================== LOGIN FLOTANTE ================== */
const FloatingUsersLogin = ({ users, onLogin, skipPin = false }) => {
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [pin, setPin] = useState('');
  const [error, setError] = useState(false);

  const regularUsers = useMemo(() => (users || []).filter(u => {
    const role = normName(u?.role).toLowerCase();
    return !role.includes('root');
  }), [users]);

  const filtered = useMemo(() => {
    const q = normName(search.trim());
    if (!q) return regularUsers;
    return regularUsers.filter(u => normName(u.name).includes(q));
  }, [regularUsers, search]);

  const positioned = useMemo(() => {
    const total = Math.max(filtered.length, 1);
    const isMobileLayout = typeof window !== 'undefined' && window.innerWidth < 640;
    // El panel ocupa la parte superior; las burbujas viven en la banda inferior.
    const centerX = 50;
    const centerY = isMobileLayout ? 76 : 72;
    // Radio adaptativo: crece con el número de usuarios, pero se mantiene en la banda inferior.
    const radiusX = Math.min(isMobileLayout ? 40 : 46, 26 + total * 0.6);
    const radiusY = Math.min(isMobileLayout ? 20 : 24, 10 + total * 0.55);
    return filtered.map((u, i) => {
      const angle = (i / total) * Math.PI * 2 - Math.PI / 2;
      const seed = normName(u.name).split('').reduce((s, c) => s + (c.charCodeAt(0) || 0), 0);
      // Jitter irregular para que no formen una elipse perfecta
      const jitterX = ((seed % 13) - 6) * 0.9;
      const jitterY = ((Math.floor(seed / 13) % 11) - 5) * 0.8;
      const x = centerX + Math.cos(angle) * radiusX + jitterX;
      const y = centerY + Math.sin(angle) * radiusY + jitterY;
      return {
        ...u,
        _x: Math.max(8, Math.min(92, x)),
        _y: Math.max(isMobileLayout ? 56 : 54, Math.min(94, y)),
        _delay: ((seed % 8) * 0.42).toFixed(2)
      };
    });
  }, [filtered]);

  const handleKey = (num) => {
    if (error) { setError(false); setPin(''); }
    if (pin.length >= 4) return;
    const np = pin + num;
    setPin(np);
    if (np.length === 4) {
      if (np === String(selected?.pin || '')) {
        setTimeout(() => onLogin(selected), 180);
      } else {
        setError(true);
        setTimeout(() => { setPin(''); setError(false); }, 550);
      }
    }
  };

  if (selected) {
    return (
      <div className="fixed inset-0 z-[200] bg-base flex flex-col items-center justify-center p-4 fade-slide-up">
        <button onClick={() => { setSelected(null); setPin(''); setError(false); }} className="absolute top-4 left-4 btn-base btn-ghost text-xs">← Volver</button>
        <div className={`w-24 h-24 rounded-full border-2 overflow-hidden mb-4 bg-accent flex items-center justify-center text-white font-black text-4xl ${error ? 'animate-bounce border-red-500' : 'border-main'}`}>
          {selected.avatar ? <img src={selected.avatar} className="w-full h-full object-cover"/> : selected.name.charAt(0)}
        </div>
        <h2 className="text-2xl font-black text-main mb-1 text-center">{selected.name}</h2>
        <p className="text-[11px] font-bold uppercase tracking-widest text-accent mb-6">{selected.department || selected.role || 'Usuario'}</p>
        <div className="flex gap-4 mb-8">
          {[0,1,2,3].map(i => (
            <div key={i} className={`w-4 h-4 rounded-full ${i < pin.length ? (error ? 'bg-red-500' : 'bg-accent') : 'bg-surface-alt border border-main'}`} />
          ))}
        </div>
        <div className="grid grid-cols-3 gap-3 w-full max-w-[240px]">
          {['1','2','3','4','5','6','7','8','9'].map(n => (
            <button key={n} onClick={() => handleKey(n)} className="btn-base btn-ghost py-4 text-xl">{n}</button>
          ))}
          <button onClick={() => setPin(p => p.slice(0,-1))} className="btn-base btn-ghost py-4 text-sm font-medium">Borrar</button>
          <button onClick={() => handleKey('0')} className="btn-base btn-ghost py-4 text-xl">0</button>
          <div />
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-[200] bg-base overflow-hidden">
      <div className="absolute inset-x-0 top-0 px-3 pt-[max(16px,env(safe-area-inset-top))] pb-3 flex justify-center pointer-events-none">
        <div className="pointer-events-auto w-full max-w-[340px] sm:max-w-[380px] rounded-3xl bg-surface/95 backdrop-blur-xl border border-main shadow-2xl p-5 fade-slide-up">
          <div className="flex items-center justify-center mb-3">
            <div className="brand-logo-pink-ring"><img src={BRAND_LOGO_URL} alt="INGESA" className="brand-logo-box" /></div>
          </div>
          <h2 className="text-lg font-black text-main mb-1 text-center">¿Quién eres?</h2>
          <p className="text-[11px] text-muted text-center mb-3">Toca tu burbuja o búscate aquí</p>
          <input
            autoFocus
            value={search}
            onChange={e => setSearch(e.target.value)}
            placeholder="Escribir mi nombre…"
            className="input-base text-sm text-center font-bold"
          />
          <div className="mt-3 max-h-[22vh] overflow-y-auto space-y-1 -mx-1 px-1">
            {filtered.map(u => (
              <button key={u.id} onClick={() => (skipPin ? onLogin(u) : setSelected(u))} className="w-full text-left p-2 rounded-lg hover:bg-surface-alt flex items-center gap-2 min-w-0">
                <div className="w-8 h-8 rounded-full bg-accent flex items-center justify-center text-white text-xs font-black overflow-hidden shrink-0">
                  {u.avatar ? <img src={u.avatar} className="w-full h-full object-cover"/> : u.name.charAt(0)}
                </div>
                <span className="text-xs font-bold truncate">{u.name}</span>

/* ================== ONBOARDING: AVATAR ==================
   ▼ Muestra un spinner mientras la galería carga.
   ▼ Solo permite saltar cuando la carga terminó (o pasado el timeout).
*/
const AvatarOnboarding = ({ gallery, galleryLoading, user, canSkip, onSave, onSkip }) => {
  const [chosen, setChosen] = useState(null);
  const [saving, setSaving] = useState(false);

  const avatars = useMemo(() => {
    const list = (gallery || []).filter(a => a.kind === 'avatar' && a.active !== false);
    const byFamily = new Map();
    list.forEach(a => {
      const fid = String(a.familyId || a.id);
      if (!byFamily.has(fid)) byFamily.set(fid, { id: fid, name: a.name || 'Avatar', asset: a });
    });
    const arr = Array.from(byFamily.values());
    const seed = String(user?.id || 'x').split('').reduce((s, c) => s + c.charCodeAt(0), 0);
    arr.sort((a, b) => {
      const ha = (a.id.charCodeAt(0) * 31 + seed) % 997;
      const hb = (b.id.charCodeAt(0) * 31 + seed) % 997;
      return ha - hb;
    });
    return arr;
  }, [gallery, user]);

  const [timedOut, setTimedOut] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setTimedOut(true), 10000);
    return () => clearTimeout(t);
  }, []);
  const isStillLoading = !!galleryLoading && !timedOut && avatars.length === 0;
  const hasAvatars = avatars.length > 0;
  const allowSkip = canSkip || (!isStillLoading && !hasAvatars) || timedOut;

  const handleConfirm = async () => {
    if (!chosen) return;
    setSaving(true);
    try { await onSave(chosen.asset); }
    finally { setSaving(false); }
  };

  return (
    <div className="fixed inset-0 z-[210] bg-base flex flex-col fade-slide-up">
      <div className="shrink-0 px-4 pt-[max(14px,env(safe-area-inset-top))] pb-3 border-b border-main bg-surface">
        <div className="text-[10px] font-black uppercase tracking-widest text-accent">Paso 1 de 2</div>
        <h2 className="text-xl font-black text-main">Elige tu avatar</h2>
        <p className="text-[11px] text-muted mt-1">
          {isStillLoading
            ? 'Buscando avatares disponibles…'
            : allowSkip
              ? 'Toca uno para elegirlo. Puedes cambiarlo cuando quieras.'
              : 'Necesitas elegir un avatar para continuar.'}
        </p>
      </div>

      <div className="flex-1 overflow-y-auto p-4">
        {isStillLoading ? (
          <LoadingSpinner label="Cargando avatares…" />
        ) : hasAvatars ? (
          <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-3 sm:gap-4">
            {avatars.map((a, i) => {
              const isSel = chosen?.id === a.id;
              return (
                <button
                  key={a.id}
                  onClick={() => setChosen(a)}
                  className={`avatar-pick pop-in relative aspect-square rounded-full overflow-hidden border-2 ${isSel ? 'selected border-accent' : 'border-main'}`}
                  style={{ animationDelay: `${Math.min(i * 40, 800)}ms` }}
                >
                  <img src={a.asset.previewDataUrl || a.asset.downloadURL || ''} alt={a.name} className="w-full h-full object-cover" loading="lazy" />
                  {isSel && <div className="absolute inset-0 bg-accent/25 flex items-center justify-center text-white text-2xl font-black">✓</div>}
                </button>
              );
            })}
          </div>
        ) : (
          <div className="text-center text-xs text-muted py-20 px-6">
            No hay avatares disponibles todavía. Puedes continuar y elegir uno después desde el botón 🎨 Personalizar.
          </div>
        )}
      </div>

      <div className="shrink-0 p-4 bg-surface border-t border-main pb-[max(14px,env(safe-area-inset-bottom))] flex gap-2">
        {allowSkip && (
          <button onClick={onSkip} disabled={saving} className="btn-base btn-ghost flex-1 text-xs">Ahora no</button>
        )}
        <button onClick={handleConfirm} disabled={!chosen || saving} className={`btn-base btn-primary text-xs ${allowSkip ? 'flex-[2]' : 'w-full'}`}>
          {saving ? 'Guardando…' : '✓ Confirmar avatar'}
        </button>
      </div>
    </div>
  );
};

/* ================== ONBOARDING: WALLPAPER ==================
   ▼ MODIFICADO: el botón "Saltar" solo aparece si canSkip es true.
*/
const WallpaperOnboarding = ({ gallery, galleryLoading, mobile, user, canSkip, onSave, onSkip }) => {
  const [chosen, setChosen] = useState(null);
  const [preview, setPreview] = useState(null);
  const [saving, setSaving] = useState(false);
  const [idx, setIdx] = useState(0);
  const touchStartX = useRef(null);

  const list = useMemo(() => (gallery || []).filter(a => a.kind === 'wallpaper' && a.active !== false && (mobile ? (a.orientation === 'mobile' || !a.orientation) : (a.orientation !== 'mobile'))), [gallery, mobile]);

  const [timedOut, setTimedOut] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setTimedOut(true), 10000);
    return () => clearTimeout(t);
  }, []);
  const isStillLoading = !!galleryLoading && !timedOut && list.length === 0;
  const allowSkip = canSkip || (!isStillLoading && list.length === 0) || timedOut;

  useEffect(() => {
    if (list.length && !preview) setPreview(list[0]);
  }, [list]);

  const goTo = (i) => {
    if (!list.length) return;
    const n = ((i % list.length) + list.length) % list.length;
    setIdx(n);
    setPreview(list[n]);
  };

  const onTouchStart = (e) => { touchStartX.current = e.touches?.[0]?.clientX ?? null; };
  const onTouchEnd = (e) => {
    if (touchStartX.current == null) return;
    const dx = (e.changedTouches?.[0]?.clientX ?? 0) - touchStartX.current;
    if (Math.abs(dx) > 45) goTo(idx + (dx < 0 ? 1 : -1));
    touchStartX.current = null;
  };

  const handleConfirm = async () => {
    if (!preview) return;
    setSaving(true);
    try { await onSave(preview); }
    finally { setSaving(false); }
  };

  return (
    <div className="fixed inset-0 z-[210] bg-black flex flex-col fade-slide-up">
      <div className="absolute inset-0 pointer-events-none" style={{ top: 'env(safe-area-inset-top)' }}>
        {preview && (
          <img
            src={preview.downloadURL || preview.previewDataUrl || ''}
            alt="wallpaper"
            className="w-full h-full object-cover"
            style={{ objectPosition: 'center center' }}
          />
        )}
        <div className="absolute inset-0 bg-gradient-to-b from-black/55 via-transparent to-black/70" />
      </div>

      <div className="relative z-10 flex flex-col h-full pt-[max(14px,env(safe-area-inset-top))]">
        <div className="shrink-0 px-4 pt-3 pb-3 flex items-center justify-between">
          <div>
            <div className="text-[10px] font-black uppercase tracking-widest text-white/70">Paso 2 de 2</div>
            <h2 className="text-xl font-black text-white drop-shadow">Elige tu fondo</h2>
          </div>
          {allowSkip && (
            <button onClick={onSkip} disabled={saving} className="btn-base text-xs bg-black/40 backdrop-blur text-white border border-white/20">Saltar</button>
          )}
        </div>

        <div
          className="flex-1 min-h-0 flex items-center justify-center"
          onTouchStart={mobile ? onTouchStart : undefined}
          onTouchEnd={mobile ? onTouchEnd : undefined}
        >
          {isStillLoading && <LoadingSpinner label="Cargando fondos…" dark />}
          {!isStillLoading && !list.length && (
            <div className="text-center text-xs font-bold px-6 py-4 rounded-2xl" style={{ background: 'rgba(0,0,0,0.55)', backdropFilter: 'blur(10px)', color: 'rgba(255,255,255,0.85)' }}>
              No hay fondos disponibles todavía. Puedes continuar y elegir uno después desde 🎨 Personalizar.
            </div>
          )}
        </div>

        {mobile && (
          <div className="shrink-0 pb-[max(20px,env(safe-area-inset-bottom))] px-4 space-y-3">
            <div className="flex items-center justify-center gap-1.5">
              {list.slice(0, Math.min(list.length, 12)).map((_, i) => (
                <button key={i} onClick={() => goTo(i)} className={`h-1.5 rounded-full transition-all ${i === idx ? 'w-5 bg-white' : 'w-1.5 bg-white/40'}`} />
              ))}
            </div>
            {allowSkip && !preview && (
              <button onClick={onSkip} disabled={saving} className="btn-base btn-ghost w-full text-sm">Saltar</button>
            )}
            <button onClick={handleConfirm} disabled={!preview || saving} className="btn-base btn-primary w-full text-sm">
              {saving ? 'Guardando…' : '✓ Usar este fondo'}
            </button>
          </div>
        )}
      </div>

      {!mobile && (
        <div className="relative z-10 shrink-0 border-t border-white/10 bg-black/70 backdrop-blur-xl pb-[max(14px,env(safe-area-inset-bottom))]">
          <div className="px-4 py-3 flex items-center justify-between">
            <div className="text-[11px] font-black text-white/80 truncate max-w-[50%]">{preview?.name || 'Fondo'}</div>
            <div className="flex gap-2">
              {allowSkip && (
                <button onClick={onSkip} disabled={saving} className="btn-base btn-ghost text-xs">Saltar</button>
              )}
              <button onClick={handleConfirm} disabled={!preview || saving} className="btn-base btn-primary text-xs">{saving ? 'Guardando…' : '✓ Usar este fondo'}</button>
            </div>
          </div>
          <div className="overflow-x-auto px-4 pb-1">
            <div className="flex gap-3 min-w-max">
              {list.map((a, i) => (
                <button
                  key={a.id}
                  onClick={() => goTo(i)}
                  className={`wp-thumb shrink-0 w-28 h-16 rounded-lg overflow-hidden border-2 ${preview?.id === a.id ? 'active' : 'border-white/20'}`}
                >
                  <img src={a.previewDataUrl || a.downloadURL || ''} className="w-full h-full object-cover" alt={a.name} />
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

/* ================== CONTROLADOR DE ONBOARDING ==================
   ▼ MODIFICADO: calcula canSkip por cada paso y lo pasa a los hijos.
*/
const OnboardingFlow = ({ user, gallery, galleryLoading, mobile, prefs, onAvatarSaved, onWallpaperSaved, onFinish }) => {
  const [step, setStep] = useState('avatar');

  // ¿Ya tiene un avatar precargado? (desde Google, o una elección previa)
  const hasPreloadedAvatar = !!(user?.avatar || prefs?.avatarAssetId || prefs?.avatarUrl);
  // ¿Ya tiene un wallpaper precargado?
  const hasPreloadedWallpaper = !!(mobile
    ? (prefs?.wallpaperMobileAssetId)
    : (prefs?.wallpaperAssetId));

  return step === 'avatar'
    ? <AvatarOnboarding
        gallery={gallery}
        galleryLoading={galleryLoading}
        user={user}
        canSkip={hasPreloadedAvatar}
        onSave={async (asset) => { await onAvatarSaved(asset); setStep('wallpaper'); }}
        onSkip={() => setStep('wallpaper')}
      />
    : <WallpaperOnboarding
        gallery={gallery}
        galleryLoading={galleryLoading}
        mobile={mobile}
        user={user}
        canSkip={hasPreloadedWallpaper}
        onSave={async (asset) => { await onWallpaperSaved(asset); onFinish(); }}
        onSkip={onFinish}
      />;
};

// Sesión local ligera: evita persistir avatares/base64 u otros campos pesados.
const persistIngesaSession = (user) => {
  if (!user) return;
  const compact = {};
  const omit = new Set(['pin','password','passcode','avatarData','wallpaperData','previewDataUrl']);
  Object.entries(user).forEach(([key, value]) => {
    if (omit.has(key)) return;
    if (typeof value === 'string' && value.length > 16000) return;
    if (value && typeof value === 'object' && !Array.isArray(value)) return;
    compact[key] = value;
  });
  const serialized = JSON.stringify(compact);
  try { localStorage.setItem('ingesa_logged_user', serialized); return; }
  catch (error) {
    // Recupera espacio de cachés regenerables y reintenta una sola vez.
    try {
      const keys = Object.keys(localStorage).filter(k => k.startsWith('ingesa_') && !['ingesa_logged_user','ingesa_dark_theme','ingesa_palette_index'].includes(k));
      keys.sort((a,b) => (localStorage.getItem(b)||'').length - (localStorage.getItem(a)||'').length);
      keys.forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });
      localStorage.setItem('ingesa_logged_user', serialized);
    } catch (retryError) {
      console.warn('[session storage quota] La sesión seguirá activa hasta cerrar o recargar la pestaña.', retryError);
    }
  }
};

    const root = cloudDb.collection('profile_media_gallery');
    const timestamp = firebase.firestore.FieldValue.serverTimestamp();
