  <style>
  :root {
    --bg-base: #f9fafb; --bg-surface: #ffffff; --bg-surface-alt: #f3f4f6;
    --text-main: #111827; --text-muted: #6b7280; --border-main: #e5e7eb;
    --accent: #e62b70; --accent-hover: #d11f5d;
    --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  }
  .dark-theme {
    --bg-base: #111827; --bg-surface: #1f2937; --bg-surface-alt: #374151;
    --text-main: #f9fafb; --text-muted: #9ca3af; --border-main: #374151;
    --accent: #e62b70; --accent-hover: #fc4889;
    --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  }
  .bg-base { background-color: var(--bg-base); }
  .bg-surface { background-color: var(--bg-surface); }
  .bg-surface-alt { background-color: var(--bg-surface-alt); }
  .text-main { color: var(--text-main); }
  .text-muted { color: var(--text-muted); }
  .border-main { border-color: var(--border-main); }
  .text-accent { color: var(--accent); }
  .bg-accent { background-color: var(--accent); }
  html, body { -webkit-text-size-adjust: 100%; height: 100%; margin: 0; overflow: hidden; background-color: var(--bg-base); color: var(--text-main); font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border-main); border-radius: 4px; }
  .card-box { background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 12px; box-shadow: var(--shadow-soft); transition: all 0.3s ease; }
  .btn-base { border-radius: 6px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; padding: 0.5rem 1rem; border: 1px solid transparent; }
  .btn-base:active { transform: translateY(1px); }
  .btn-base:disabled { opacity: 0.5; pointer-events: none; }
  .btn-primary { background: var(--accent); color: #ffffff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-ghost { background: var(--bg-surface-alt); color: var(--text-main); border: 1px solid var(--border-main); }
  .btn-ghost:hover:not(:disabled) { background: var(--border-main); }
  .input-base { background: var(--bg-surface); border: 1px solid var(--border-main); border-radius: 6px; padding: 0.75rem; outline: none; width: 100%; color: var(--text-main); transition: all 0.2s ease; }
  .input-base:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(230, 43, 112, 0.15); }
  @keyframes spin-slow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .spin-ring { animation: spin-slow 2s linear infinite; }
  .module-frame { width: 100%; height: 100%; border: 0; background: var(--bg-surface); display: block; }
  .scanner-shell > .portal-chrome { display: none; }
  .scanner-shell > .scanner-content { position: absolute; inset: 0; height: 100%; }
  .scanner-shell .module-frame { position: absolute; inset: 0; width: 100%; height: 100%; }
  @keyframes slide-down { 0% { transform: translateY(-100%); opacity: 0; } 10% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100%); opacity: 0; } }
  .toast-anim { animation: slide-down 3s ease forwards; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .brand-logo-box { height: 38px; max-height: 100%; width: auto; display: block; object-fit: contain; }
  .brand-logo-pink-ring { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; background: var(--accent); border: 2px solid var(--accent); border-radius: 12px; box-shadow: 0 0 10px rgba(230, 43, 112, 0.35); }
  .control-dock { display: flex; align-items: center; gap: 6px; padding: 4px; border: 1px solid var(--border-main); background: var(--bg-surface-alt); border-radius: 9999px; box-shadow: var(--shadow-soft); }
  .control-dock button { width: 32px; height: 32px; }
  .rainbow-button { border: 2px solid var(--bg-surface); border-radius: 9999px; background: conic-gradient(#ef4444, #f59e0b, #eab308, #22c55e, #06b6d4, #3b82f6, #8b5cf6, #ec4899, #ef4444); box-shadow: 0 0 0 1px var(--border-main); cursor: pointer; transition: transform .15s ease; }
  .rainbow-button:hover { transform: scale(1.08); }
  .accent-modal-backdrop { background: rgba(0, 0, 0, .55); backdrop-filter: blur(4px); }
  .accent-swatch { width: 42px; height: 42px; border-radius: 9999px; border: 3px solid var(--bg-surface); box-shadow: 0 0 0 1px var(--border-main); cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .accent-swatch:hover { transform: scale(1.12); }
  .accent-swatch.active { box-shadow: 0 0 0 3px var(--accent), 0 0 0 5px var(--bg-surface); }
  @keyframes alertPulseGlow { 0%,100%{box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);} 50%{box-shadow: 0 0 25px rgba(239, 68, 68, 1);} }
  .alert-modal-glow { animation: alertPulseGlow 2s infinite; }
  @keyframes fuchsiaGlow { 0%, 100% { box-shadow: 0 0 8px var(--accent), 0 0 16px rgba(230, 43, 112, 0.6); } 50% { box-shadow: 0 0 16px var(--accent), 0 0 26px rgba(230, 43, 112, 0.9); } }
  .glow-fuchsia { border-color: var(--accent) !important; animation: fuchsiaGlow 2s infinite ease-in-out; }
  .maes-widget { display: flex; flex-direction: column; overflow: hidden; }
  .maes-widget .widget-bar { user-select: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 4px 6px; }
  .maes-widget .widget-body { flex: 1; min-height: 0; position: relative; }
  .maes-widget .widget-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg-base); display: block; }

<script>
/* INGESA Firestore read meter v3 — iframe -> index bridge, client-side estimate only. */
(function (global) {
  'use strict';
  if (global.INGESA_QUOTA_METER?.version === 3) return;

  const PROTOCOL = 1;
  const HELLO = 'INGESA_QUOTA_BRIDGE_HELLO';
  const ACK = 'INGESA_QUOTA_BRIDGE_ACK';
  const REPORT = 'INGESA_QUOTA_BRIDGE_REPORT';
  const chainMethods = new Set(['collection', 'collectionGroup', 'doc', 'where', 'orderBy', 'limit', 'startAt', 'startAfter', 'endAt', 'endBefore', 'select', 'withConverter']);
  const installedDbs = new WeakMap();

  const normalizeAppKey = value => String(value || 'app').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'app';
  const safeUser = () => {
    try {
      const user = JSON.parse(global.localStorage.getItem('ingesa_logged_user') || 'null');
      const id = String(user?.id || user?.uid || user?.username || user?.name || '').trim();
      return id ? { id, name: String(user?.name || id), role: String(user?.role || '') } : null;
    } catch (e) { return null; }
  };
  const countInitialSnapshot = snap => Array.isArray(snap?.docs) ? Math.max(1, snap.docs.length) : 1;

  function install(db, appName) {
    if (!db || typeof db.collection !== 'function') return db;
    if (installedDbs.has(db)) return installedDbs.get(db);

    const rawCollection = db.collection.bind(db);
    const rawDoc = typeof db.doc === 'function' ? db.doc.bind(db) : null;
    const rawCollectionGroup = typeof db.collectionGroup === 'function' ? db.collectionGroup.bind(db) : null;
    const FieldValue = global.firebase?.firestore?.FieldValue;
    const localAppKey = normalizeAppKey(appName || global.document?.title || 'app');
    const pending = new Map();
    const preConfiguration = new Map();
    const proxyCache = new WeakMap();
    const frameApps = new WeakMap();
    const embedded = !!(global.parent && global.parent !== global);
    let enabled = false;
    let configKnown = false;
    let localStarted = false;
    let bridgeMode = embedded ? 'pending' : 'local';
    let bridgeTimer = null;
    let configUnsub = null;

    const dayKey = () => new Date().toISOString().slice(0, 10);
    const makeDocId = (date, uid) => `${date}__${encodeURIComponent(uid).slice(0, 900)}`;

    function flushOne(key) {
      const bucket = pending.get(key);
      if (!bucket || bucket.busy || !bucket.reads || !FieldValue?.increment) return;
      const appCounts = { ...bucket.readsByApp };
      const reads = Object.values(appCounts).reduce((sum, value) => sum + value, 0);
      if (!reads) return;
      bucket.reads = 0;
      bucket.readsByApp = Object.create(null);
      bucket.busy = true;
      const ref = rawCollection('firestore_quota_usage').doc(makeDocId(bucket.date, bucket.user.id));
      const readsByApp = Object.fromEntries(Object.entries(appCounts).map(([key, value]) => [key, FieldValue.increment(value)]));
      ref.set({
        date: bucket.date,
        userId: bucket.user.id,
        userName: bucket.user.name,
        role: bucket.user.role,
        estimatedReads: FieldValue.increment(reads),
        meterWrites: FieldValue.increment(1),
        readsByApp,
        updatedAt: FieldValue.serverTimestamp()
      }, { merge: true }).catch(e => {
        bucket.reads += reads;
        for (const [app, value] of Object.entries(appCounts)) bucket.readsByApp[app] = (bucket.readsByApp[app] || 0) + value;
        console.warn('[quota meter] no se pudo guardar el agregado', e?.code || e?.message || e);
      }).finally(() => {
        bucket.busy = false;
        if (bucket.reads >= 25) flushOne(key);
        else if (!bucket.reads) pending.delete(key);
      });
    }

    function flushAll() { for (const key of pending.keys()) flushOne(key); }

    function addToBucket(units, sourceApp) {
      const count = Math.max(0, Math.floor(Number(units) || 0));
      if (!count) return;
      if (!configKnown) {
        const app = normalizeAppKey(sourceApp || localAppKey);
        preConfiguration.set(app, (preConfiguration.get(app) || 0) + count);
        return;
      }
      if (!enabled) return;
      const user = safeUser();
      if (!user) return;
      const date = dayKey();
      const key = `${date}::${user.id}`;
      const bucket = pending.get(key) || { date, user, reads: 0, readsByApp: Object.create(null), busy: false };
      bucket.user = user;
      const app = normalizeAppKey(sourceApp || localAppKey);
      bucket.reads += count;
      bucket.readsByApp[app] = (bucket.readsByApp[app] || 0) + count;
      pending.set(key, bucket);
      if (bucket.reads >= 25) flushOne(key);
    }

    function sendReport(units, sourceApp) {
      const count = Math.max(0, Math.floor(Number(units) || 0));
      if (!count) return;
      const app = normalizeAppKey(sourceApp || localAppKey);
      if (!embedded || bridgeMode === 'local') { addToBucket(count, app); return; }
      if (bridgeMode === 'pending') {
        preConfiguration.set(app, (preConfiguration.get(app) || 0) + count);
        return;
      }
      try { global.parent.postMessage({ type: REPORT, protocol: PROTOCOL, app, units: count }, '*'); }
      catch (e) { /* Do not break the business screen if the host refuses messaging. */ }
    }

    function startLocalMeter() {
      if (localStarted) return;
      localStarted = true;
      try {
        configUnsub = rawCollection('launcher_settings').doc('firestore_quota_monitor').onSnapshot(doc => {
          if (doc?.metadata?.fromCache === true) return;
          const next = !!(doc.exists && doc.data()?.enabled === true);
          const wasEnabled = enabled;
          configKnown = true;
          if (wasEnabled && !next) flushAll();
          enabled = next;
          const queued = Array.from(preConfiguration.entries());
          preConfiguration.clear();
          if (enabled) queued.forEach(([app, count]) => addToBucket(count, app));
        }, e => {
          configKnown = true;
          enabled = false;
          preConfiguration.clear();
          console.warn('[quota meter] no se pudo leer el interruptor', e?.code || e?.message || e);
        });
        if (typeof global.setInterval === 'function') global.setInterval(flushAll, 60000);
        if (typeof global.addEventListener === 'function') global.addEventListener('pagehide', flushAll);
        global.document?.addEventListener?.('visibilitychange', () => {
          if (global.document.visibilityState === 'hidden') flushAll();
        });
      } catch (e) {
        configKnown = true;
        enabled = false;
        console.warn('[quota meter] no se pudo inicializar', e?.code || e?.message || e);
      }
    }

    function isLiveFrame(source) {
      if (!source || !global.document?.querySelectorAll) return false;
      try { return Array.from(global.document.querySelectorAll('iframe')).some(frame => frame.contentWindow === source); }
      catch (e) { return false; }
    }

    function handleParentMessage(event) {
      const data = event?.data;
      const source = event?.source;
      if (!data || data.protocol !== PROTOCOL || !isLiveFrame(source)) return;
      if (data.type === HELLO) {
        frameApps.set(source, normalizeAppKey(data.app || 'iframe'));
        try { source.postMessage({ type: ACK, protocol: PROTOCOL }, '*'); } catch (e) {}
        return;
      }
      if (data.type === REPORT && frameApps.has(source)) {
        sendReport(data.units, frameApps.get(source));
      }
    }

    function activateLocalFallback() {
      if (bridgeMode !== 'pending') return;
      bridgeMode = 'local';
      if (bridgeTimer) global.clearTimeout(bridgeTimer);
      global.removeEventListener?.('message', handleChildAck);
      startLocalMeter();
      const queued = Array.from(preConfiguration.entries());
      preConfiguration.clear();
      queued.forEach(([app, count]) => addToBucket(count, app));
    }

    function handleChildAck(event) {
      if (!embedded || event?.source !== global.parent || event?.data?.type !== ACK || event?.data?.protocol !== PROTOCOL) return;
      if (bridgeMode !== 'pending') return;
      bridgeMode = 'parent';
      if (bridgeTimer) global.clearTimeout(bridgeTimer);
      global.removeEventListener?.('message', handleChildAck);
      const queued = Array.from(preConfiguration.entries());
      preConfiguration.clear();
      for (const [app, count] of queued) {
        try { global.parent.postMessage({ type: REPORT, protocol: PROTOCOL, app, units: count }, '*'); } catch (e) {}
      }
    }

    // Any level may receive reports from its direct child iframes; embedded index pages relay upward.
    global.addEventListener?.('message', handleParentMessage);
    if (embedded) {
      global.addEventListener?.('message', handleChildAck);
      try { global.parent.postMessage({ type: HELLO, protocol: PROTOCOL, app: localAppKey }, '*'); }
      catch (e) { activateLocalFallback(); }
      if (bridgeMode === 'pending' && typeof global.setTimeout === 'function') bridgeTimer = global.setTimeout(activateLocalFallback, 700);
      else if (bridgeMode === 'local') startLocalMeter();
    } else {
      startLocalMeter();
    }

    function queryChangeReads(snap) {
      if (Array.isArray(snap?.docs) && typeof snap.docChanges === 'function') {
        try {
          // Conservatively count removed results: a changed document leaving a query may be billable.
          // Physical deletions may be over-counted because the client cannot distinguish the cause.
          return snap.docChanges().filter(change => change.type === 'removed' || !change.doc?.metadata?.hasPendingWrites).length;
        } catch (e) {}
      }
      return 1;
    }

    function wrapListener(target, original, args) {
      const nextIndex = typeof args[0] === 'function' || typeof args[0]?.next === 'function' ? 0 :
        (typeof args[1] === 'function' || typeof args[1]?.next === 'function' ? 1 : -1);
      if (nextIndex < 0) return original.apply(target, args);
      const wrappedArgs = args.slice();
      const observer = wrappedArgs[nextIndex];
      let hasServerSnapshot = false;
      let lastDocFingerprint = null;
      const meterNext = snap => {
        const fromCache = snap?.metadata?.fromCache === true;
        const pendingWrite = snap?.metadata?.hasPendingWrites === true;
        if (!fromCache && !pendingWrite) {
          if (!hasServerSnapshot) {
            sendReport(countInitialSnapshot(snap), localAppKey);
            hasServerSnapshot = true;
            if (!Array.isArray(snap?.docs)) {
              try { lastDocFingerprint = JSON.stringify({ exists: snap.exists, data: snap.exists ? snap.data() : null }); } catch (e) { lastDocFingerprint = ''; }
            }
          } else if (Array.isArray(snap?.docs) && typeof snap.docChanges === 'function') {
            sendReport(queryChangeReads(snap), localAppKey);
          } else {
            let fingerprint = '';
            try { fingerprint = JSON.stringify({ exists: snap.exists, data: snap.exists ? snap.data() : null }); } catch (e) { fingerprint = String(Date.now()); }
            if (fingerprint !== lastDocFingerprint) sendReport(1, localAppKey);
            lastDocFingerprint = fingerprint;
          }
        }
        if (typeof observer === 'function') observer(snap);
        else if (observer && typeof observer.next === 'function') observer.next(snap);
      };
      if (typeof observer === 'function') wrappedArgs[nextIndex] = meterNext;
      else wrappedArgs[nextIndex] = { ...observer, next: meterNext };
      return original.apply(target, wrappedArgs);
    }

    function wrapRef(ref) {
      if (!ref || (typeof ref !== 'object' && typeof ref !== 'function')) return ref;
      if (proxyCache.has(ref)) return proxyCache.get(ref);
      const proxy = new Proxy(ref, {
        get(target, prop) {
          const value = Reflect.get(target, prop, target);
          if (prop === 'get' && typeof value === 'function') {
            return (...args) => Promise.resolve(value.apply(target, args)).then(snap => {
              if (!(args[0] && args[0].source === 'cache') && snap?.metadata?.fromCache !== true) sendReport(countInitialSnapshot(snap), localAppKey);
              return snap;
            });
          }
          if (prop === 'onSnapshot' && typeof value === 'function') return (...args) => wrapListener(target, value, args);
          if (chainMethods.has(prop) && typeof value === 'function') return (...args) => wrapRef(value.apply(target, args));
          return typeof value === 'function' ? value.bind(target) : value;
        }
      });
      proxyCache.set(ref, proxy);
      return proxy;
    }

    const proxyDb = new Proxy(db, {
      get(target, prop) {
        if (prop === 'collection') return (...args) => wrapRef(rawCollection(...args));
        if (prop === 'doc' && rawDoc) return (...args) => wrapRef(rawDoc(...args));
        if (prop === 'collectionGroup' && rawCollectionGroup) return (...args) => wrapRef(rawCollectionGroup(...args));
        if (prop === 'runTransaction' && typeof target.runTransaction === 'function') {
          return (updateFunction, options) => target.runTransaction(transaction => {
            const txProxy = new Proxy(transaction, {
              get(tx, txProp) {
                const method = Reflect.get(tx, txProp, tx);
                if (txProp === 'get' && typeof method === 'function') return (...args) => Promise.resolve(method.apply(tx, args)).then(snap => { sendReport(countInitialSnapshot(snap), localAppKey); return snap; });
                if (txProp === 'getAll' && typeof method === 'function') return (...args) => Promise.resolve(method.apply(tx, args)).then(snaps => { (snaps || []).forEach(snap => sendReport(countInitialSnapshot(snap), localAppKey)); return snaps; });
                return typeof method === 'function' ? method.bind(tx) : method;
              }
            });
            return updateFunction(txProxy);
          }, options);
        }
        const value = Reflect.get(target, prop, target);
        return typeof value === 'function' ? value.bind(target) : value;
      }
    });

    try { installedDbs.set(db, proxyDb); } catch (e) {}
    return proxyDb;
  }

  global.INGESA_QUOTA_METER = { version: 3, install };
})(window);
</script>

const DEFAULT_WALLPAPER = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920&auto=format&fit=crop";
const VALLEJO_NAME = 'VALLEJO';
const HERNAN_NAME = 'HERNAN';
const NATHALY_NAME = 'NATHALY';
const normName = (s) => String(s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const isVallejoUser = (user) => {
  if (!user) return false;
  if (user.isVallejo === true) return true;
  return normName(user.name).includes(VALLEJO_NAME);
};
const isHernanUser = (user) => {
  if (!user) return false;
  if (user.isHernan === true) return true;
  if (isVallejoUser(user)) return false;
  const normalizedName = normName(user.name);
  return normalizedName.includes(HERNAN_NAME) || normalizedName.includes(NATHALY_NAME);
};
const isNathalyUser = (user) => !!user && normName(user.name).includes(NATHALY_NAME);
const canUseSandbox = (user) => {
  if (!user) return false;
  if (isVallejoUser(user)) return true;
  if (user.sandboxGranted === true) return true;
  try {
    const granted = JSON.parse(localStorage.getItem('ingesa_sandbox_granted_v1') || '[]');
    if (Array.isArray(granted) && granted.some(id => String(id) === String(user.id))) return true;
  } catch (e) {}
  return false;
};
const isDevUser = (user) => {
  if (!user) return false;
  if (isVallejoUser(user)) return false;
  // Identidad exacta del desarrollador: HERNÁN/DEV.
  // normName elimina acentos y convierte a mayúsculas, por lo que
  // HERNÁN/DEV y HERNAN/DEV se consideran la misma identidad.
  // No se aceptan HERNÁN, DEV ni roles genéricos por separado.
  return normName(user.name).trim() === 'HERNAN/DEV';
};

/* ===== Limpieza selectiva de caché local =====
   Se usa para el broadcast de "Actualización disponible" que envía VALLEJO.
   Borra cachés de datos (imágenes, listados, plantillas, etiquetas, docs cacheados)
   para que los clientes vuelvan a leer todo desde Firestore y reciban la versión
   más reciente. NO cierra sesión ni borra preferencias del usuario. */
const INGESA_CACHE_KEEP = new Set([
  'ingesa_logged_user',           // sesión activa
  'ingesa_dark_theme',            // preferencia de tema
  'ingesa_palette_index',         // preferencia de acento
  'ingesa_saved_groups',          // grupos guardados del usuario
  'ingesa_install_prompt_dismissed',
  'ingesa_one_time_reset_v1',     // flag del reset de una sola vez
  'ingesa_app_reset_seen_v1',     // marca de última actualización procesada
  'ingesa_labelDesign',           // diseño preferido de etiqueta
  'ingesa_dev_zebra_layout',
  'ingesa_dev_zebra_export'
]);
const clearIngesaCaches = () => {
  try {
    const keys = Object.keys(localStorage);
    keys.forEach(k => {
      if (!k.startsWith('ingesa_')) return;
      if (INGESA_CACHE_KEEP.has(k)) return;
      try { localStorage.removeItem(k); } catch(e) {}
    });
  } catch(e) {}
  try { sessionStorage.removeItem('ingesa_install_pending'); } catch(e) {}

const useBackBlocker = () => {
  const [showToast, setShowToast] = useState(false);
  useEffect(() => {
    if (IS_SANDBOX) return undefined;
    let lastPopTime = 0;
    const handlePopState = () => {
      const now = Date.now();
      if (now - lastPopTime < 800) { window.history.go(-2); }
      else { window.history.pushState(null, "", window.location.href); lastPopTime = now; setShowToast(true); setTimeout(() => setShowToast(false), 3000); }
    };
    window.history.pushState(null, "", window.location.href);
    window.addEventListener('popstate', handlePopState);
    return () => window.removeEventListener('popstate', handlePopState);
  }, []);
  return showToast;
};

const LogoDisplay = ({ snoozeUntil }) => {
  const remaining = snoozeUntil ? Math.max(0, Number(snoozeUntil.until) - Date.now()) : 0;
  const hasTimer = !!snoozeUntil && remaining > 0;
  if (!hasTimer) return <BrandLogoCenter />;
  const totalSec = Math.floor(remaining / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const label = h > 0
    ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`
    : `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return (
    <div className="brand-logo-pink-ring" style={{ position: 'relative' }}>
      <img src={BRAND_LOGO_URL} alt="INGESA" className="brand-logo-box" style={{ opacity: 0.28 }} />
      <div style={{

      }}>{label}</div>
    </div>
  );
};

const ModuleFrame = ({ tool, currentUser, scannerMode = false, isDark, paletteIndex, isActive, registerIframe }) => {
  const frameRef = useRef(null);
  useEffect(() => {
    const handleIndexCacheMessage = event => {
      const data = event?.data;
      if (!data || data.protocol !== 1 || !['INDEX_CACHE_GET', 'INDEX_CACHE_SET'].includes(data.type) ||
          event.source !== frameRef.current?.contentWindow || !data.requestId ||
          typeof data.key !== 'string' || data.key.length > 120) return;
      const storageKey = `ingesa_iframe_cache_v1_${encodeURIComponent(String(tool?.id || 'module'))}_${encodeURIComponent(data.key)}`;
      if (data.type === 'INDEX_CACHE_SET') {
        try {
          const serialized = JSON.stringify({ savedAt: Date.now(), value: data.value });
          if (serialized.length > 750000) return;
          localStorage.setItem(storageKey, serialized);
          event.source.postMessage({ type: 'INDEX_CACHE_SAVED', protocol: 1, requestId: data.requestId }, '*');
        } catch (error) { console.warn('[index cache] no se pudo guardar', error?.name || error); }
        return;
      }
      let record = null;
      try { record = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch (error) {}
      try {
        event.source.postMessage({
          type: 'INDEX_CACHE_RESULT', protocol: 1, requestId: data.requestId,
          key: data.key, value: record?.value ?? null, savedAt: Number(record?.savedAt) || 0
        }, '*');
      } catch (error) {}
    };
    window.addEventListener('message', handleIndexCacheMessage);
    return () => window.removeEventListener('message', handleIndexCacheMessage);
  }, [tool?.id]);
  const sendContext = (targetWindow = null) => {
    const user = currentUser || {};
    const palette = PALETTES[paletteIndex] || PALETTES[0];
    const vars = isDark ? palette.dark : palette.light;
    let userDirectory = [];
    try { userDirectory = JSON.parse(localStorage.getItem('ingesa_user_directory_v1') || 'null')?.users || []; } catch (e) {}
    const payload = { type: 'INDEX_CONTEXT', payload: { id: user.id || '', name: user.name || '', role: user.role || 'operador', department: user.department || 'General', departamento: user.department || 'General', userDirectory, allowedTools: user.allowedTools || [], scannerMode: !!scannerMode, scannerToolId: tool?.id || '', scannerToolName: tool?.name || '', theme: isDark ? 'dark' : 'light', isDark: !!isDark, accent: vars.accent, accentHover: vars.accentHover, bgBase: vars.bgBase, bgSurface: vars.bgSurface, bgSurfaceAlt: vars.bgSurfaceAlt, textMain: vars.textMain, textMuted: vars.textMuted, borderMain: vars.border, isVallejo: isVallejoUser(user) } };
    const dest = targetWindow || frameRef.current?.contentWindow;
    if (dest) dest.postMessage(payload, '*');
  };
  useEffect(() => { sendContext(); const t1 = setTimeout(() => sendContext(), 300); const t2 = setTimeout(() => sendContext(), 1000); return () => { clearTimeout(t1); clearTimeout(t2); }; }, [currentUser, tool?.id, scannerMode, isDark, paletteIndex, isActive]);
  useEffect(() => { const h = (e) => { if (e.data && e.data.type === 'CHILD_READY' && e.source === frameRef.current?.contentWindow) sendContext(e.source); }; window.addEventListener('message', h); return () => window.removeEventListener('message', h); }, [currentUser, tool?.id, scannerMode, isDark, paletteIndex]);
  return <iframe ref={(el) => { frameRef.current = el; if (registerIframe && el) registerIframe(tool.id, el); }} onLoad={() => { sendContext(); setTimeout(() => sendContext(), 300); setTimeout(() => sendContext(), 1000); }} key={tool.id} srcDoc={tool.rawHtml} className="module-frame" title={tool.name || 'Módulo'}></iframe>;
};

const dataUrlBytes = dataUrl => Math.max(0, Math.floor((String(dataUrl || '').split(',')[1] || '').length * 3 / 4));
const compressImageToBase64 = (file, { maxSide = 1600, maxBytes = 420 * 1024, square = false, backgroundColor = '#ffffff' } = {}) => new Promise((resolve, reject) => {
  if (!file?.type?.startsWith('image/')) return reject(new Error('Selecciona una imagen válida.'));
  const image = new Image(); const objectUrl = URL.createObjectURL(file);
  image.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('No se pudo leer la imagen.')); };
  image.onload = () => {
    try {
      const sw = image.naturalWidth || image.width, sh = image.naturalHeight || image.height;
      const side = Math.min(sw, sh); const scale = Math.min(1, maxSide / (square ? side : Math.max(sw, sh)));
      const width = Math.max(1, Math.round((square ? side : sw) * scale)); const height = Math.max(1, Math.round((square ? side : sh) * scale));
      const canvas = document.createElement('canvas'); canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = backgroundColor || '#ffffff'; ctx.fillRect(0, 0, width, height);
      if (square) { const sx = Math.max(0, (sw - side) / 2), sy = Math.max(0, (sh - side) / 2); ctx.drawImage(image, sx, sy, side, side, 0, 0, width, height); }
      else ctx.drawImage(image, 0, 0, width, height);
      for (const quality of [0.86, 0.76, 0.66, 0.56, 0.46]) { const data = canvas.toDataURL('image/jpeg', quality); if (dataUrlBytes(data) <= maxBytes) { URL.revokeObjectURL(objectUrl); resolve(data); return; } }
      URL.revokeObjectURL(objectUrl); reject(new Error('La imagen sigue siendo demasiado grande después de comprimirla.'));
    } catch (e) { URL.revokeObjectURL(objectUrl); reject(e); }
  }; image.src = objectUrl;
});

// ================== PC WALLPAPER COLLECTION (ingesa-cloud) ==================
const PC_WALLPAPER_COLLECTION = 'pc_wallpaper_gallery';
const uploadPCWallpaper = async ({ name, file, createdBy, createdById, onProgress }) => {
  if (!cloudDb) throw new Error('No está disponible ingesa-cloud.');
  if (!file?.type?.startsWith('image/')) throw new Error('Selecciona una imagen válida.');
  onProgress?.('Comprimiendo para PC…');
  const dataUrl = await compressImageToBase64(file, { maxSide: 2400, maxBytes: 700 * 1024, backgroundColor: '#0a0a0a' });
  const previewDataUrl = await compressImageToBase64(file, { maxSide: 480, maxBytes: 60 * 1024, backgroundColor: '#0a0a0a' });
  if (dataUrl.length + previewDataUrl.length > 900 * 1024) throw new Error('La imagen comprimida no cabe en un único documento. Prueba con una imagen de menor resolución.');
  const id = `pcwp_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  await cloudDb.collection(PC_WALLPAPER_COLLECTION).doc(id).set({
    name: String(name || 'Wallpaper PC').trim().slice(0, 80),
    dataUrl,
    previewDataUrl,
    contentType: 'image/jpeg',
    encoding: 'base64',
    bytes: dataUrlBytes(dataUrl),
    active: true,
    createdBy: createdBy || '',
    createdById: createdById || '',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true });
  return id;
};
const readWallpaperDataUrl = async (id) => {
  if (!id || !cloudDb) return '';
  const pcSnap = await cloudDb.collection(PC_WALLPAPER_COLLECTION).doc(String(id)).get();
  if (pcSnap.exists) return pcSnap.data().dataUrl || '';
  const mobSnap = await cloudDb.collection('profile_media_gallery').doc(String(id)).get();
  if (!mobSnap.exists) return '';
  const data = mobSnap.data();
  if (data.chunkCount) {
    const chunks = await cloudDb.collection('profile_media_gallery').doc(String(id)).collection('chunks').orderBy('index').get();
    const sorted = chunks.docs.map(doc => doc.data()).sort((a, b) => Number(a.index) - Number(b.index));
    if (sorted.length !== Number(data.chunkCount)) throw new Error(`Fondo incompleto (${sorted.length}/${data.chunkCount} partes).`);
    return `data:${data.contentType || 'image/jpeg'};base64,${sorted.map(chunk => chunk.data || '').join('')}`;
  }
  return data.downloadURL || data.previewDataUrl || '';
};

const ProfileMediaModal = ({ user, tools = [], accentColor = '#e62b70', isDark = false, gallery = [], isAdmin = false, loading = false, onClose, onChoose, onClear, onUpload, onDelete, embedded = false, initialKind = 'avatar', lockKind = false }) => {
  const [kind, setKind] = useState(initialKind);
  const [selectedToolId, setSelectedToolId] = useState('');
  const [preparedAssets, setPreparedAssets] = useState([]);
  const [expandedAvatarFamily, setExpandedAvatarFamily] = useState('');
  const [preparing, setPreparing] = useState(false);
  const [saving, setSaving] = useState(false);
  const [uploadProgress, setUploadProgress] = useState('');
  const [notice, setNotice] = useState('');
  const currentAssetId = kind === 'avatar' ? user?.profileAvatarAssetId : user?.profileWallpaperAssetId;
  const visibleAssets = gallery.filter(item => item.kind === kind && item.active !== false);
  const queuedAssets = preparedAssets.filter(item => item.kind === kind);
  const displayGroups = kind === 'avatar' ? (() => {
    const grouped = new Map();
    visibleAssets.forEach(asset => {
      const familyId = String(asset.familyId || asset.id);
      if (!grouped.has(familyId)) grouped.set(familyId, { id: familyId, name: asset.name || 'Avatar', items: [] });
      grouped.get(familyId).items.push(asset);
    });
    return Array.from(grouped.values()).map(group => ({ ...group, items: group.items.slice().sort((a, b) => Number(a.accentIndex ?? 999) - Number(b.accentIndex ?? 999)) }));
  })() : visibleAssets.map(asset => ({ id: String(asset.id), name: asset.name || 'Wallpaper', items: [asset] }));
  const handleImages = async event => {
    const files = Array.from(event.target.files || []); event.target.value = '';
    if (!files.length) return;
    if (files.length > 30) { alert('Selecciona hasta 30 imágenes por lote.'); return; }
    setPreparing(true); setNotice('');
    const prepared = []; const errors = [];
    for (const file of files) {
      if (!file.type?.startsWith('image/')) { errors.push(`${file.name}: no es una imagen.`); continue; }
      try {
        const name = (file.name || '').replace(/\.[^.]+$/, '').trim() || (kind === 'avatar' ? 'Avatar' : 'Wallpaper');
        const familyId = `media_${Date.now()}_${Math.random().toString(36).slice(2, 10)}`;
        if (kind === 'tool_icon') {
          const tool = tools.find(item => String(item.id) === String(selectedToolId));
          if (!tool) { errors.push(`${file.name}: selecciona una herramienta.`); continue; }
          setNotice(`Preparando ícono de ${tool.name || selectedToolId}…`);
          const dataUrl = await compressImageToBase64(file, { maxSide: 512, maxBytes: 180 * 1024, square: true, backgroundColor: '#253044' });
          const previewDataUrl = await compressImageToBase64(file, { maxSide: 220, maxBytes: 40 * 1024, square: true, backgroundColor: '#253044' });
          prepared.push({ key: familyId, familyId: `tool_icon_${selectedToolId}`, kind, name: tool.name || file.name, toolId: String(selectedToolId), toolName: tool.name || file.name, dataUrl, previewDataUrl });
        } else if (kind === 'avatar') {
          const variants = [];
          for (let index = 0; index < PALETTES.length; index++) {
            const palette = PALETTES[index];
            const color = palette.swatch || (isDark ? palette.dark : palette.light).accent;
            setNotice(`Preparando ${name}: variante ${index + 1} de ${PALETTES.length} (${palette.name})…`);
            const dataUrl = await compressImageToBase64(file, { maxSide: 512, maxBytes: 150 * 1024, square: true, backgroundColor: color });
            const previewDataUrl = await compressImageToBase64(file, { maxSide: 280, maxBytes: 40 * 1024, square: true, backgroundColor: color });
            variants.push({ accentId: palette.id, accentName: palette.name, accentIndex: index, accentColor: color, dataUrl, previewDataUrl });
          }
          prepared.push({ key: familyId, familyId, kind, name, variants });
        } else {
          setNotice(`Preparando ${name}…`);
          const dataUrl = await compressImageToBase64(file, { maxSide: 1800, maxBytes: 700 * 1024, backgroundColor: '#ffffff' });
          const previewDataUrl = await compressImageToBase64(file, { maxSide: 280, maxBytes: 40 * 1024, backgroundColor: '#ffffff' });
          prepared.push({ key: familyId, familyId, kind, name, dataUrl, previewDataUrl });
        }
      } catch (error) { errors.push(`${file.name}: ${error.message}`); }
    }
    if (prepared.length) setPreparedAssets(prev => [...prev, ...prepared]);
    setNotice(`${prepared.length} imagen(es) preparada(s).${errors.length ? ` ${errors.length} no se pudieron preparar: ${errors.join(' ')}` : ''}`);
    setPreparing(false);
  };
  const handleUploadBatch = async () => {
    if (!queuedAssets.length) return;
    setSaving(true); setNotice('');
    const failed = []; let uploaded = 0;
    for (let index = 0; index < queuedAssets.length; index++) {
      const asset = queuedAssets[index];
      setUploadProgress(`${index + 1} de ${queuedAssets.length}`);
      try {
        await onUpload({ ...asset, onProgress: detail => setUploadProgress(`${index + 1}/${queuedAssets.length} · ${detail}`) });
        uploaded++;
      } catch (error) { failed.push({ ...asset, error: error.message || 'Error de carga' }); }
    }
    const completedKeys = new Set(queuedAssets.filter(asset => !failed.some(item => item.key === asset.key)).map(asset => asset.key));
    setPreparedAssets(prev => prev.filter(asset => !completedKeys.has(asset.key)));
    setNotice(`${uploaded} imagen(es) agregada(s) a la galería.${failed.length ? ` ${failed.length} quedó/aron en la cola por error; puedes reintentar.` : ''}`);
    setUploadProgress(''); setSaving(false);
  };
  const removeFromQueue = key => setPreparedAssets(prev => prev.filter(asset => asset.key !== key));
  const choose = async asset => {
    if (kind === 'tool_icon') { setNotice('El ícono se asigna al subirlo y ya se ve para todos los usuarios.'); return; }
    setSaving(true); setNotice('Guardando selección…');
    try { await onChoose(kind, asset); setNotice(kind === 'avatar' ? 'Avatar actualizado.' : 'Fondo personal actualizado.'); }
    catch (error) { setNotice('No se pudo guardar: ' + error.message); }
    finally { setSaving(false); }
  };
  const clear = async () => {
    setSaving(true); setNotice('Restaurando…');
    try { await onClear(kind); setNotice(kind === 'avatar' ? 'Se restauró el avatar original.' : 'Se restauró el fondo global.'); }
    catch (error) { setNotice('No se pudo restaurar: ' + error.message); }
    finally { setSaving(false); }
  };
  const remove = async asset => {
    if (!window.confirm(`¿Retirar “${asset.name || 'imagen'}” de la galería?`)) return;
    setSaving(true); setNotice('Retirando imagen…');
    try { await onDelete(asset); setNotice('Imagen retirada.'); }
    catch (error) { setNotice('No se pudo retirar: ' + error.message); }
    finally { setSaving(false); }
  };
  return (
    <div className={embedded ? '' : 'fixed inset-0 z-[10070] bg-black/75 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 overflow-y-auto'} onClick={embedded ? undefined : onClose}>
      <div className={embedded ? 'pm-embedded' : 'card-box w-full max-w-3xl my-3 max-h-[94vh] overflow-y-auto'} onClick={e => e.stopPropagation()}>
        <div className="flex items-start justify-between gap-3 mb-4">
          <div><h2 className="text-xl font-black text-main">{lockKind ? '▣ Íconos de herramientas' : '🎨 Personalizar perfil'}</h2><p className="text-xs text-muted mt-1">{lockKind ? 'Sube y asigna el ícono de cada herramienta; se verá para todos los usuarios.' : 'Elige tu avatar y un fondo personal para la pantalla de inicio.'}</p></div>
          <button onClick={onClose} className="w-9 h-9 rounded-lg bg-surface-alt border border-main text-muted">✕</button>
        </div>
        <div className={`flex gap-2 mb-4${lockKind ? ' hidden' : ''}`}>
          <button onClick={() => { setKind('avatar'); setNotice(''); }} className={`btn-base flex-1 text-xs ${kind === 'avatar' ? 'btn-primary' : 'btn-ghost'}`}>👤 Avatares</button>
          <button onClick={() => { setKind('wallpaper'); setNotice(''); }} className={`btn-base flex-1 text-xs ${kind === 'wallpaper' ? 'btn-primary' : 'btn-ghost'}`}>🖼️ Fondos</button>
          {isAdmin && <button onClick={() => { setKind('tool_icon'); setNotice(''); }} className={`btn-base flex-1 text-xs ${kind === 'tool_icon' ? 'btn-primary' : 'btn-ghost'}`}>▣ Íconos</button>}
        </div>
        <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
          <p className="text-[11px] text-muted">{kind === 'avatar' ? 'El avatar aparece junto a tu nombre y en los selectores de usuario.' : kind === 'tool_icon' ? 'Cada ícono aparece junto a su herramienta para todos los usuarios.' : 'Este fondo solo afecta tu pantalla de inicio; no cambia el fondo de los demás.'}</p>
          <button disabled={saving} onClick={clear} className={`btn-base btn-ghost text-[10px]${kind === 'tool_icon' ? ' hidden' : ''}`}>{kind === 'avatar' ? '↩ Usar avatar original' : '↩ Usar fondo global'}</button>
        </div>
        {loading ? <div className="p-5 text-center text-xs text-muted">Cargando galería…</div> : displayGroups.length === 0 ? <div className="p-5 rounded-xl border border-dashed border-main text-center text-xs text-muted">Aún no hay imágenes de este tipo. {isAdmin ? 'VALLEJO puede agregar opciones a la galería.' : 'Espera a que VALLEJO agregue opciones a la galería.'}</div> : (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {displayGroups.map(group => {
              const variants = group.items;
              const chosen = variants.find(asset => String(currentAssetId || '') === String(asset.id)) || variants[0];
              const selected = variants.some(asset => String(currentAssetId || '') === String(asset.id));
              const expanded = kind === 'avatar' && variants.length > 1 && expandedAvatarFamily === group.id;
              const openOrChoose = () => variants.length > 1 ? setExpandedAvatarFamily(expanded ? '' : group.id) : choose(chosen);
              return (<div key={group.id} className={`relative overflow-hidden rounded-xl border-2 bg-surface-alt ${selected ? 'border-accent ring-2 ring-accent/30' : 'border-main'}`}>
                <button disabled={saving} onClick={openOrChoose} className="w-full text-left">
                  <div className={`${kind === 'avatar' ? 'aspect-square p-4' : 'aspect-video'} bg-surface flex items-center justify-center`}><img src={chosen?.previewDataUrl || chosen?.downloadURL || ''} alt={group.name} loading="lazy" className={`w-full h-full ${kind === 'avatar' ? 'rounded-full object-cover' : 'object-cover'}`} /></div>
                  <div className="p-2"><div className="text-[11px] font-bold text-main truncate">{group.name}</div><div className="text-[9px] text-muted">{selected ? '✓ En uso' : variants.length > 1 ? `Ver abanico · ${variants.length} acentos` : kind === 'tool_icon' ? 'Ícono activo' : 'Toca para usar'}</div></div>
                </button>
                {expanded && <div className="px-1 pb-3 border-t border-main/60"><div className="text-[9px] text-muted text-center pt-2">Elige el fondo</div><div className="flex items-center justify-center px-2 pt-3 pb-2 overflow-visible">{variants.map((asset, index) => { const middle = (variants.length - 1) / 2; const angle = (index - middle) * 8; const y = Math.abs(index - middle) * 2; return <button key={asset.id} disabled={saving} onClick={() => choose(asset)} title={`${asset.accentName || 'Acento'} · ${asset.accentColor || ''}`} className={`relative shrink-0 w-10 h-10 rounded-full overflow-hidden border-2 shadow-md hover:z-20 hover:scale-110 transition-transform ${String(currentAssetId || '') === String(asset.id) ? 'border-accent ring-2 ring-accent' : 'border-white/70'}`} style={{ background: asset.accentColor || 'var(--accent)', transform: `rotate(${angle}deg) translateY(${y}px)`, marginLeft: index ? '-5px' : '0', zIndex: index + 1 }}><img src={asset.previewDataUrl || ''} alt={asset.accentName || ''} className="w-full h-full object-cover rounded-full" /></button>; })}</div><div className="flex flex-wrap justify-center gap-1 px-1">{variants.map(asset => <button key={`${asset.id}_label`} onClick={() => choose(asset)} disabled={saving} className={`px-1.5 py-0.5 rounded-full text-[8px] border ${String(currentAssetId || '') === String(asset.id) ? 'border-accent text-accent font-bold' : 'border-main text-muted'}`}>{asset.accentName || 'Acento'}</button>)}</div></div>}
                {isAdmin && <button disabled={saving} onClick={() => remove(chosen)} title="Retirar de la galería" className="absolute top-1.5 right-1.5 w-7 h-7 rounded-full bg-red-600 text-white border border-white/70 text-xs font-black shadow">×</button>}
              </div>);
            })}
          </div>
        )}
        {isAdmin && <div className="mt-5 p-3 rounded-xl border border-accent/40 bg-accent/5 space-y-3">
          <div><div className="text-xs font-black text-main">＋ Galería compartida · administración de VALLEJO</div><p className="text-[10px] text-muted mt-1">Selecciona varias imágenes del mismo tipo; se subirán una por una y aparecerán para que todos elijan.</p></div>
          {kind === 'tool_icon' && <label className="block text-[10px] font-bold text-muted">Herramienta<select value={selectedToolId} onChange={e => { setSelectedToolId(e.target.value); setPreparedAssets([]); setNotice(''); }} disabled={preparing || saving} className="input-base w-full text-xs mt-1"><option value="">Selecciona una herramienta…</option>{tools.filter(t => String(t?.name || '').trim().toLowerCase() !== 'root').map(t => <option key={t.id} value={t.id}>{t.name || t.id}</option>)}</select></label>}
          <label className="block text-[10px] font-bold text-muted">Archivos de imagen (hasta 30 por lote)<input type="file" accept="image/*" multiple onChange={handleImages} disabled={preparing || saving || (kind === 'tool_icon' && !selectedToolId)} className="input-base w-full text-[10px] mt-1" /></label>
          {preparing && <div className="text-[10px] text-muted">Comprimiendo imágenes…</div>}
          {queuedAssets.length > 0 && <div className="space-y-2"><div className="text-[10px] font-bold text-main">{queuedAssets.length} imagen(es) listas en “{kind === 'avatar' ? 'Avatares' : kind === 'wallpaper' ? 'Fondos' : 'Íconos'}”</div><div className="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-44 overflow-y-auto">{queuedAssets.map(asset => <div key={asset.key} className="flex items-center gap-2 p-1.5 rounded-lg bg-surface border border-main min-w-0"><img src={asset.previewDataUrl || asset.variants?.[0]?.previewDataUrl || ''} className={`w-9 h-9 shrink-0 ${kind === 'avatar' ? 'rounded-full' : 'rounded'} object-cover`} /><span className="text-[9px] font-bold text-main truncate flex-1" title={asset.name}>{asset.name}</span><button disabled={saving} onClick={() => removeFromQueue(asset.key)} className="text-red-500 font-black px-1" title="Quitar de la cola">×</button></div>)}</div><button disabled={saving || preparing} onClick={handleUploadBatch} className="btn-base btn-primary w-full text-xs">{saving ? `Subiendo ${uploadProgress}…` : `☁️ Subir ${queuedAssets.length} imagen(es) a la galería`}</button></div>}
          <p className="text-[9px] text-muted">Solo VALLEJO puede agregar o retirar imágenes. Los demás usuarios únicamente eligen de la galería. Los avatares se convierten a JPEG con fondo por cada acento y se guardan en partes pequeñas de Firestore; no requieren Firebase Storage.</p>
        </div>}
        {notice && <div className="mt-3 rounded-lg bg-surface-alt border border-main px-3 py-2 text-[10px] text-muted">{notice}</div>}
        {!cloudDb && isAdmin && <div className="mt-2 text-[10px] text-amber-500">Firestore del proyecto secundario no está disponible; revisa la inicialización de ingesa-cloud.</div>}
      </div>
    </div>
  );
};

const HomeClock = ({ user }) => {
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 15000); return () => clearInterval(t); }, []);
  const h = now.getHours();
  const greet = h < 6 ? 'Buenas noches' : h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  const raw = user ? String(user.name || '').trim().split(/\s+/)[0] : '';
  const first = raw ? raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase() : '';
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const dept = user?.department ? String(user.department).toUpperCase() : 'INGESA';
  return (<div className="home-clock" aria-hidden="true">
    <span className="hc-time">{hh}:{mm}</span>
    <span className="hc-sep" />
    <span className="hc-meta">
      <span className="hc-greet">{greet}{first ? `, ${first}` : ''}</span>
      <span className="hc-date">{now.toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' })}</span>
      <span className="hc-city">◈ {dept}</span>
    </span>
  </div>);
};

/* ================== BARRA SUPERIOR v5 · INGESA ==================
   Zona izquierda: hora/fecha (Guayaquil) + clima + calendario/agenda.
   Zona centro: logo INGESA mini (mismo del Splash) + reproductor música/radio.
   Zona derecha: calculadora, notas personales y herramientas (modales).
   NOTA: los permisos de agenda se aplican en el cliente Y deben reforzarse
   con las reglas de Firestore de ingesa-cloud (ver firestore-rules-v5.md).
   Sin Google Auth en el portal todavía: la agenda guarda en ingesa-cloud
   cuando cloudDb está disponible y en localStorage como respaldo.
   ================================================================ */
const GYE_TZ = 'America/Guayaquil';
const EC_HOLIDAYS_2026 = {
  '2026-01-01': 'Año Nuevo', '2026-02-16': 'Carnaval', '2026-02-17': 'Carnaval',
  '2026-04-03': 'Viernes Santo', '2026-05-01': 'Día del Trabajo', '2026-05-24': 'Batalla de Pichincha',
  '2026-08-10': 'Primer Grito de Independencia', '2026-10-09': 'Independencia de Guayaquil',
  '2026-11-02': 'Día de los Difuntos', '2026-11-03': 'Independencia de Cuenca', '2026-12-25': 'Navidad',
  '2027-01-01': 'Año Nuevo',
};
const WMO = {0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nublado',3:'Nublado',45:'Niebla',48:'Niebla',51:'Llovizna',53:'Llovizna',55:'Llovizna',61:'Lluvia ligera',63:'Lluvia',65:'Lluvia fuerte',71:'Nieve ligera',80:'Chubascos',81:'Chubascos',82:'Chubascos violentos',95:'Tormenta'};
const WMO_EMOJI = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌦️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',80:'🌧️',81:'🌧️',82:'🌧️',95:'⛈️'};
const fmtDay = (d) => { const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'); return y+'-'+m+'-'+dd; };
const loadAgendaLocal = () => { try { return JSON.parse(localStorage.getItem('ingesa_agenda_v5') || '[]'); } catch(e){ return []; } };
const saveAgendaLocal = (items) => { try { localStorage.setItem('ingesa_agenda_v5', JSON.stringify(items)); } catch(e){} };

const ClockWeatherMini = ({ user, isVallejo, isNathaly, isDev }) => {
  const [now, setNow] = useState(() => new Date());
  const [wx, setWx] = useState(null);
  const [open, setOpen] = useState(null); // null | 'cal' | 'wx'
  const [tab, setTab] = useState('cal');
  const [month, setMonth] = useState(() => { const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; });
  const [selDay, setSelDay] = useState(() => fmtDay(new Date()));
  const [items, setItems] = useState(loadAgendaLocal);
  const [title, setTitle] = useState(''); const [note, setNote] = useState('');
  const [assignTo, setAssignTo] = useState('');
  const [pairEmail, setPairEmail] = useState(() => { try { return localStorage.getItem('ingesa_agenda_pair_email') || ''; } catch(e){ return ''; } });
  const [savedMsg, setSavedMsg] = useState('');
  const [usersList, setUsersList] = useState([]); // usuarios reales de ingesa-database (colección users)
  useEffect(() => { // leer usuarios de la base principal, no de ingesa-cloud
    if (typeof db === 'undefined' || !db) return;
    let stop=false;
    try {
      const unsub = db.collection('users').onSnapshot(snap=>{
        if(stop) return;
        setUsersList(snap.docs.map(d=>{ const v=d.data()||{}; return { id:String(d.id), name:String(v.name||v.nombre||d.id) }; }).sort((a,b)=>a.name.localeCompare(b.name,'es')));
      }, ()=>{});
      return ()=>{ stop=true; try{unsub();}catch(e){} };
    } catch(e){ return ()=>{ stop=true; }; }
  }, []);
  const userName = user ? String(user.name || '') : 'Invitado';
  const norm = (s) => String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const isPair = !!pairEmail && user && user.email && String(user.email).toLowerCase() === pairEmail.toLowerCase();
  const canAssign = isVallejo || isPair;
  const canNoteToVallejo = isVallejo || isPair || isNathaly || isDev;
  useEffect(() => { const t=setInterval(()=>setNow(new Date()),1000); return ()=>clearInterval(t); }, []);
  useEffect(() => {
    let stop=false;
    const load=async()=>{ try{ const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-2.17&longitude=-79.92&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=America%2FGuayaquil'); const j=await r.json(); if(!stop && j && j.current) setWx(j.current); }catch(e){} };
    load(); const t=setInterval(load, 15*60*1000); return ()=>{ stop=true; clearInterval(t); };
  }, []);
  useEffect(() => { // agenda en la base PRINCIPAL (ingesa-database), donde viven los usuarios.
    // Si estuviera en ingesa-cloud, el pendiente nunca le llegaría al empleado: esa base no tiene la colección users.
    if (typeof db === 'undefined' || !db) return;
    let stop=false;
    try {
      const unsub = db.collection('agenda_items').orderBy('date').limit(200).onSnapshot(snap=>{
        if(stop) return; const cloud=snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
        if(cloud.length){ setItems(cloud); saveAgendaLocal(cloud); }
      }, ()=>{});
      return ()=>{ stop=true; try{unsub();}catch(e){} };
    } catch(e){ return ()=>{ stop=true; }; }
  }, []);
  const timeStr = now.toLocaleTimeString('es-EC', { timeZone: GYE_TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  const dateStr = now.toLocaleDateString('es-EC', { timeZone: GYE_TZ, weekday:'short', day:'numeric', month:'short' });
  const todayItems = items.filter(it=>it.date===fmtDay(new Date()));
  const myItems = items.filter(it=>norm(it.assignedTo)===norm(userName) || norm(it.assignedTo)==='TODOS' || (user && it.assignedToId && String(it.assignedToId)===String(user.id)));
  const addItem = async () => {
    if(!title.trim()) return;
    const picked = usersList.find(u=>String(u.id)===(assignTo||'').trim() || norm(u.name)===norm((assignTo||'').trim()));
    const target = picked ? picked.name : ((assignTo||'').trim() || userName);
    const targetId = picked ? picked.id : (norm(target)===norm(userName) && user ? String(user.id) : '');
    if(norm(target)==='VALLEJO' && !canNoteToVallejo){ setSavedMsg('Solo NATHALY y HERNÁN/DEV pueden dejarle notas a VALLEJO.'); return; }
    if(norm(target)!==norm(userName) && norm(target)!=='TODOS' && !canAssign){ setSavedMsg('Solo VALLEJO o su par pueden asignar pendientes a otros usuarios.'); return; }
    const item={ id:'ag_'+Date.now(), date: selDay, title: title.trim(), note: note.trim(), assignedTo: target, assignedToId: targetId, createdBy: userName, createdById: user ? String(user.id) : '', kind: 'pendiente', createdAt: new Date().toISOString() };
    const next=[...items, item]; setItems(next); saveAgendaLocal(next); setTitle(''); setNote(''); setSavedMsg('Guardado.');
    try{ if(typeof db!=='undefined' && db) await db.collection('agenda_items').doc(item.id).set(item); }catch(e){ setSavedMsg('Guardado solo en este dispositivo (sin conexión a ingesa-database).'); }
  };
  const delItem = async (id) => { const next=items.filter(i=>i.id!==id); setItems(next); saveAgendaLocal(next); try{ if(typeof db!=='undefined' && db) await db.collection('agenda_items').doc(id).delete(); }catch(e){} };
  const savePair = async () => { try{ localStorage.setItem('ingesa_agenda_pair_email', pairEmail.trim()); }catch(e){} setSavedMsg('Par guardado en este dispositivo.'); try{ if(typeof db!=='undefined' && db) await db.collection('launcher_settings').doc('agenda_admin').set({ pairEmail: pairEmail.trim(), updatedBy: userName, updatedAt: new Date().toISOString() }, { merge:true }); }catch(e){} };
  // calendario del mes
  const first = new Date(month.y, month.m, 1); const startDow = (first.getDay()+6)%7; const daysIn = new Date(month.y, month.m+1, 0).getDate();
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1;d<=daysIn;d++) cells.push(d);
  const monthName = new Date(month.y, month.m, 1).toLocaleDateString('es-EC', { month:'long', year:'numeric' });
  const dayItems = items.filter(it=>it.date===selDay);
  return (
    <div className="tb-clockwrap">
      <button className="tb-clock" onClick={()=>{ setTab('cal'); setOpen('cal'); }} title="Hora Guayaquil · toca para abrir calendario y agenda">
        <span className="tb-time">{timeStr}</span>
        <span className="tb-date">{dateStr} · GYE</span>
        {myItems.length>0 && <span className="tb-badge">{myItems.length}</span>}
      </button>
      <button className="tb-wx" onClick={()=>{ setTab('wx'); setOpen('cal'); }} title="Clima Guayaquil · toca para ver detalles">
        <span>{wx ? (WMO_EMOJI[wx.weather_code]||'🌡️') : '🌡️'}</span>
        <span>{wx ? Math.round(wx.temperature_2m)+'°' : '--°'}</span>
      </button>
      {open==='cal' && (
        <div className="tb-modal-backdrop" onClick={()=>setOpen(null)}>
          <div className="tb-modal" onClick={(e)=>e.stopPropagation()}>
            <div className="tb-modal-head"><b>📅 Calendario · Agenda INGESA</b><button className="tb-x" onClick={()=>setOpen(null)}>✕</button></div>
            <div className="tb-tabs">
              <button className={tab==='cal'?'on':''} onClick={()=>setTab('cal')}>Calendario</button>
              <button className={tab==='wx'?'on':''} onClick={()=>setTab('wx')}>Clima GYE</button>
              <button className={tab==='avisos'?'on':''} onClick={()=>setTab('avisos')}>Avisos ({todayItems.length})</button>
              {isVallejo && <button className={tab==='admin'?'on':''} onClick={()=>setTab('admin')}>⚙️ Solo VALLEJO</button>}
            </div>
            {tab==='cal' && (<div>
              <div className="tb-cal-nav"><button onClick={()=>setMonth(m=> m.m===0?{y:m.y-1,m:11}:{y:m.y,m:m-1})}>‹</button><b style={{textTransform:'capitalize'}}>{monthName}</b><button onClick={()=>setMonth(m=> m.m===11?{y:m.y+1,m:0}:{y:m.y,m:m+1})}>›</button></div>
              <div className="tb-cal-grid">{['L','M','X','J','V','S','D'].map(d=><div key={d} className="tb-cal-dow">{d}</div>)}{cells.map((d,i)=>{ if(!d) return <div key={i}/>; const ds=fmtDay(new Date(month.y,month.m,d)); const hol=EC_HOLIDAYS_2026[ds]; const has=items.some(it=>it.date===ds); const isToday=ds===fmtDay(new Date()); return (<button key={i} className={'tb-cal-day'+(isToday?' today':'')+(selDay===ds?' sel':'')+(hol?' hol':'')} onClick={()=>setSelDay(ds)} title={hol||''}>{d}{hol?' •':''}{has?' ▸':''}</button>); })}</div>
              <div className="tb-day"><b>{selDay}</b>{EC_HOLIDAYS_2026[selDay] ? <span> · 🎉 {EC_HOLIDAYS_2026[selDay]}</span> : null}
                {dayItems.length===0 ? <p className="tb-muted">Sin pendientes ese día.</p> : dayItems.map(it=>(<div key={it.id} className="tb-item"><b>{it.title}</b><span> → {it.assignedTo} · por {it.createdBy}</span>{it.note ? <div>{it.note}</div> : null}{(canAssign || norm(it.createdBy)===norm(userName)) && <button onClick={()=>delItem(it.id)}>Eliminar</button>}</div>))}
                <input className="tb-input" placeholder="Nuevo pendiente / tarea…" value={title} onChange={(e)=>setTitle(e.target.value)} />

              <h3>Mis pendientes</h3>
              {myItems.length===0 ? <p className="tb-muted">No tienes pendientes asignados.</p> : myItems.map(it=>(<div key={it.id} className="tb-item"><b>{it.title}</b><span> · {it.date}</span></div>))}
            </div>)}
            {tab==='admin' && isVallejo && (<div className="tb-pad">
              <h3>⚙️ Administración de la agenda</h3>

              <label>Correo Google de tu par</label>
              <input className="tb-input" placeholder="correo@gmail.com" value={pairEmail} onChange={(e)=>setPairEmail(e.target.value)} />
              <button className="tb-btn" onClick={savePair}>Guardar par</button>
              <p className="tb-muted">Admins con permisos altos: NATHALY y HERNÁN/DEV. Los demás admins futuros no podrán asignar ni editar esta agenda.</p>
